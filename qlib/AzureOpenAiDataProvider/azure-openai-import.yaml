                  0, the model will use [log probability](https://en.wikipedia.org/wiki/Log_probability) to automatically
                  increase the temperature until certain thresholds are hit.
                type: number
                minimum: 0
                maximum: 1
              filename:
                type: string
                description: The optional filename or descriptive identifier to associate with with the audio data
            required:
            - file
            - model
          encoding: {}
    - pointer: '#/components/schemas/OpenAI.CreateImageEditRequest'
      expected:
        type: object
        required:
        - image
        - prompt
        properties:
          image:
            type: object
            description: "The image(s) to edit. Must be a supported image file or an array of images.\n  For the\
              \ GPT image models (`gpt-image-1`, `gpt-image-1-mini`, and `gpt-image-1.5`), each image should be\
              \ a `png`, `webp`, or `jpg`\n  file less than 50MB. You can provide up to 16 images.\n  `chatgpt-image-latest`\
              \ follows the same input constraints as GPT image models.\n  For `dall-e-2`, you can only provide\
              \ one image, and it should be a square\n  `png` file less than 4MB."
          prompt:
            type: object
            description: A text description of the desired image(s). The maximum length is 1000 characters for `dall-e-2`,
              and 32000 characters for the GPT image models.
          mask:
            type: object
            description: An additional image whose fully transparent areas (e.g. where alpha is zero) indicate where
              `image` should be edited. If there are multiple images provided, the mask will be applied on the first
              image. Must be a valid PNG file, less than 4MB, and have the same dimensions as `image`.
          background:
            type: object
            description: "Allows to set transparency for the background of the generated image(s).\n  This parameter\
              \ is only supported for the GPT image models. Must be one of\n  `transparent`, `opaque` or `auto`\
              \ (default value). When `auto` is used, the\n  model will automatically determine the best background\
              \ for the image.\n  If `transparent`, the output format needs to support transparency, so it\n  should\
              \ be set to either `png` (default value) or `webp`."
          model:
            type: string
            description: The model to use for image generation. Defaults to `gpt-image-1.5`.
            x-oaiTypeLabel: string
          n:
            type: object
            description: The number of images to generate. Must be between 1 and 10.
          size:
            type: object
            description: The size of the generated images. For `gpt-image-2` and `gpt-image-2-2026-04-21`, arbitrary
              resolutions are supported as `WIDTHxHEIGHT` strings, for example `1536x864`. Width and height must
              both be divisible by 16 and the requested aspect ratio must be between 1:3 and 3:1. Resolutions above
              `2560x1440` are experimental, and the maximum supported resolution is `3840x2160`. The requested size
              must also satisfy the model's current pixel and edge limits. The standard sizes `1024x1024`, `1536x1024`,
              and `1024x1536` are supported by the GPT image models; `auto` is supported for models that allow automatic
              sizing. For `dall-e-2`, use one of `256x256`, `512x512`, or `1024x1024`. For `dall-e-3`, use one of
              `1024x1024`, `1792x1024`, or `1024x1792`.
          response_format:
            type: object
            description: The format in which the generated images are returned. Must be one of `url` or `b64_json`.
              URLs are only valid for 60 minutes after the image has been generated. This parameter is only supported
              for `dall-e-2` (default is `url` for `dall-e-2`), as GPT image models always return base64-encoded
              images.
          output_format:
            type: object
            description: "The format in which the generated images are returned. This parameter is\n  only supported\
              \ for the GPT image models. Must be one of `png`, `jpeg`, or `webp`.\n  The default value is `png`."
          output_compression:
            type: object
            description: "The compression level (0-100%) for the generated images. This parameter\n  is only supported\
              \ for the GPT image models with the `webp` or `jpeg` output\n  formats, and defaults to 100."
          user:
            type: object
            description: A unique identifier representing your end-user, which can help OpenAI to monitor and detect
              abuse. [Learn more](/docs/guides/safety-best-practices#end-user-ids).
          input_fidelity:
            type: object
          stream:
            type: object
            description: "Edit the image in streaming mode. Defaults to `false`. See the\n  [Image generation guide](/docs/guides/image-generation)\
              \ for more information."
          partial_images:
            type: object
          quality:
            type: object
            description: The quality of the image that will be generated for GPT image models. Defaults to `auto`.
      replacement:
        type: object
        required:
        - image
        - prompt
        - model
        properties:
          image:
            description: "The image(s) to edit. Must be a supported image file or an array of images.\n  For the\
              \ GPT image models (`gpt-image-1`, `gpt-image-1-mini`, and `gpt-image-1.5`), each image should be\
              \ a `png`, `webp`, or `jpg`\n  file less than 50MB. You can provide up to 16 images.\n  `chatgpt-image-latest`\
              \ follows the same input constraints as GPT image models.\n  For `dall-e-2`, you can only provide\
              \ one image, and it should be a square\n  `png` file less than 4MB."
            anyOf:
            - type: string
              format: binary
            - type: array
              items:
                type: string
                format: binary
              minItems: 1
              maxItems: 16
          prompt:
            description: A text description of the desired image(s). The maximum length is 1000 characters for `dall-e-2`,
              and 32000 characters for the GPT image models.
            type: string
          mask:
            description: An additional image whose fully transparent areas (e.g. where alpha is zero) indicate where
              `image` should be edited. If there are multiple images provided, the mask will be applied on the first
              image. Must be a valid PNG file, less than 4MB, and have the same dimensions as `image`.
            type: string
            format: binary
          background:
            description: "Allows to set transparency for the background of the generated image(s).\n  This parameter\
              \ is only supported for the GPT image models. Must be one of\n  `transparent`, `opaque` or `auto`\
              \ (default value). When `auto` is used, the\n  model will automatically determine the best background\
              \ for the image.\n  If `transparent`, the output format needs to support transparency, so it\n  should\
              \ be set to either `png` (default value) or `webp`."
            type: string
            enum:
            - transparent
            - opaque
            - auto
          model:
            type: string
            description: The model to use for image generation. Defaults to `gpt-image-1.5`.
            x-oaiTypeLabel: string
          n:
            description: The number of images to generate. Must be between 1 and 10.
            type: integer
            minimum: 1
            maximum: 10
          size:
            description: The size of the generated images. For `gpt-image-2` and `gpt-image-2-2026-04-21`, arbitrary
              resolutions are supported as `WIDTHxHEIGHT` strings, for example `1536x864`. Width and height must
              both be divisible by 16 and the requested aspect ratio must be between 1:3 and 3:1. Resolutions above
              `2560x1440` are experimental, and the maximum supported resolution is `3840x2160`. The requested size
              must also satisfy the model's current pixel and edge limits. The standard sizes `1024x1024`, `1536x1024`,
              and `1024x1536` are supported by the GPT image models; `auto` is supported for models that allow automatic
              sizing. For `dall-e-2`, use one of `256x256`, `512x512`, or `1024x1024`. For `dall-e-3`, use one of
              `1024x1024`, `1792x1024`, or `1024x1792`.
            type: string
          response_format:
            description: The format in which the generated images are returned. Must be one of `url` or `b64_json`.
              URLs are only valid for 60 minutes after the image has been generated. This parameter is only supported
              for `dall-e-2` (default is `url` for `dall-e-2`), as GPT image models always return base64-encoded
              images.
            type: string
            enum:
            - url
            - b64_json
          output_format:
            description: "The format in which the generated images are returned. This parameter is\n  only supported\
              \ for the GPT image models. Must be one of `png`, `jpeg`, or `webp`.\n  The default value is `png`."
            type: string
            enum:
            - png
            - jpeg
            - webp
          output_compression:
            description: "The compression level (0-100%) for the generated images. This parameter\n  is only supported\
              \ for the GPT image models with the `webp` or `jpeg` output\n  formats, and defaults to 100."
            type: integer
            minimum: 0
            maximum: 100
          user:
            description: A unique identifier representing your end-user, which can help OpenAI to monitor and detect
