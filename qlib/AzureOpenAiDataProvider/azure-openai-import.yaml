documents:
- name: AzureOpenAi
  source: https://raw.githubusercontent.com/Azure/azure-rest-api-specs/a6943a926f76b3a2f90371b3466157eddf760e25/specification/ai/data-plane/OpenAI.v1/azure-v1-preview-generated.json
  output: azure-openai-v1.json
  manifest: AzureOpenAiDataProvider:AzureOpenAiManifest::Manifest
  provenance: AzureOpenAiSchema.qc
  json: true
  normalize:
  - reason: The Azure Files API accepts named multipart file bytes and optional expires_after[anchor]/expires_after[seconds]
      form fields. The generated document omits the file type, incorrectly requires expiration, and omits its encoding
      and Azure bounds. Live verification on 2026-09-11 accepted an upload without expiration, ignored a JSON expiration
      part, and required seconds between 259200 and 2592000 for bracket fields. See https://learn.microsoft.com/en-us/rest/api/microsoft-foundry/azureopenai/files
    replace_required:
    - pointer: '#/components/schemas/OpenAI.CreateFileRequest'
      expected:
      - file
      - expires_after
      - purpose
      replacement:
      - file
      - purpose
    replace_values:
    - pointer: '#/components/schemas/OpenAI.CreateFileRequest/properties/file'
      expected:
        description: The File object (not file name) to be uploaded.
      replacement:
        description: The File object (not file name) to be uploaded.
        type: string
        format: binary
    - pointer: '#/components/schemas/OpenAI.CreateFileRequest/properties/expires_after/properties/seconds'
      expected:
        type: integer
        format: int32
      replacement:
        type: integer
        format: int32
        minimum: 259200
        maximum: 2592000
    - pointer: '#/paths/~1files/post/requestBody/content/multipart~1form-data'
      expected:
        schema: &id001
          $ref: '#/components/schemas/OpenAI.CreateFileRequest'
      replacement:
        schema: *id001
        encoding:
          expires_after:
            style: deepObject
            explode: true
  - reason: 'Microsoft documents multipart audio transcription, translation, image edits, and optional video reference
      images. The generated preview document incorrectly emits object placeholders for scalar and file fields and
      JSON content for upload operations. Restore the documented types and finite choices, choose the supported
      multipart representation for video creation, and require Azure deployment names instead of public OpenAI model
      defaults. Sources: https://learn.microsoft.com/en-us/azure/foundry/openai/reference-preview-latest and https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/video-generation
      . Array option names retain the documented multipart [] spelling.'
    replace_values:
    - pointer: '#/paths/~1audio~1transcriptions/post/requestBody/content'
      expected:
        application/json:
          schema:
            type: object
            properties:
              file:
                type: object
                description: 'The audio file object (not file name) to transcribe, in one of these formats: flac,
                  mp3, mp4, mpeg, mpga, m4a, ogg, wav, or webm.'
                x-oaiTypeLabel: file
              model:
                type: string
                description: The model to use for this transcription request.
                x-oaiTypeLabel: string
              language:
                type: object
                description: The language of the input audio. Supplying the input language in [ISO-639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes)
                  (e.g. `en`) format will improve accuracy and latency.
              prompt:
                type: object
                description: An optional text to guide the model's style or continue a previous audio segment. The
                  [prompt](/docs/guides/speech-to-text#prompting) should match the audio language. This field is
                  not supported when using `gpt-4o-transcribe-diarize`.
              response_format:
                type: object
              temperature:
                type: object
                description: The sampling temperature, between 0 and 1. Higher values like 0.8 will make the output
                  more random, while lower values like 0.2 will make it more focused and deterministic. If set to
                  0, the model will use [log probability](https://en.wikipedia.org/wiki/Log_probability) to automatically
                  increase the temperature until certain thresholds are hit.
              include:
                type: object
                description: "Additional information to include in the transcription response.\n  `logprobs` will\
                  \ return the log probabilities of the tokens in the\n  response to understand the model's confidence\
                  \ in the transcription.\n  `logprobs` only works with response_format set to `json` and only with\n\
                  \  the models `gpt-4o-transcribe`, `gpt-4o-mini-transcribe`, and `gpt-4o-mini-transcribe-2025-12-15`.\
                  \ This field is not supported when using `gpt-4o-transcribe-diarize`."
              timestamp_granularities:
                type: object
                description: "The timestamp granularities to populate for this transcription. `response_format`\
                  \ must be set `verbose_json` to use timestamp granularities. Either or both of these options are\
                  \ supported: `word`, or `segment`. Note: There is no additional latency for segment timestamps,\
                  \ but generating word timestamps incurs additional latency.\n  This option is not available for\
                  \ `gpt-4o-transcribe-diarize`."
              stream:
                type: object
              chunking_strategy:
                type: object
              known_speaker_names:
                type: object
              known_speaker_references:
                type: object
              filename:
                type: string
                description: The optional filename or descriptive identifier to associate with with the audio data.
            required:
            - file
            - model
      replacement:
        multipart/form-data:
          schema:
            type: object
            properties:
              file:
                description: 'The audio file object (not file name) to transcribe, in one of these formats: flac,
                  mp3, mp4, mpeg, mpga, m4a, ogg, wav, or webm.'
                x-oaiTypeLabel: file
                type: string
                format: binary
              model:
                type: string
                description: The model to use for this transcription request.
                x-oaiTypeLabel: string
              language:
                description: The language of the input audio. Supplying the input language in [ISO-639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes)
                  (e.g. `en`) format will improve accuracy and latency.
                type: string
              prompt:
                description: An optional text to guide the model's style or continue a previous audio segment. The
                  [prompt](/docs/guides/speech-to-text#prompting) should match the audio language. This field is
                  not supported when using `gpt-4o-transcribe-diarize`.
                type: string
              response_format:
                type: string
                enum:
                - json
                - text
                - srt
                - verbose_json
                - vtt
                - diarized_json
              temperature:
                description: The sampling temperature, between 0 and 1. Higher values like 0.8 will make the output
                  more random, while lower values like 0.2 will make it more focused and deterministic. If set to
                  0, the model will use [log probability](https://en.wikipedia.org/wiki/Log_probability) to automatically
                  increase the temperature until certain thresholds are hit.
                type: number
                minimum: 0
                maximum: 1
              stream:
                type: boolean
              chunking_strategy:
                anyOf:
                - type: string
                  enum:
                  - auto
                - type: object
                  required:
                  - type
                  properties:
                    type:
                      type: string
                      enum:
                      - server_vad
                    prefix_padding_ms:
                      type: integer
                      minimum: 0
                    silence_duration_ms:
                      type: integer
                      minimum: 0
                    threshold:
                      type: number
                      minimum: 0
                      maximum: 1
              filename:
                type: string
                description: The optional filename or descriptive identifier to associate with with the audio data.
              include[]:
                description: "Additional information to include in the transcription response.\n  `logprobs` will\
                  \ return the log probabilities of the tokens in the\n  response to understand the model's confidence\
                  \ in the transcription.\n  `logprobs` only works with response_format set to `json` and only with\n\
                  \  the models `gpt-4o-transcribe`, `gpt-4o-mini-transcribe`, and `gpt-4o-mini-transcribe-2025-12-15`.\
                  \ This field is not supported when using `gpt-4o-transcribe-diarize`."
                type: array
                items:
                  type: string
                  enum:
                  - logprobs
              timestamp_granularities[]:
                description: "The timestamp granularities to populate for this transcription. `response_format`\
                  \ must be set `verbose_json` to use timestamp granularities. Either or both of these options are\
                  \ supported: `word`, or `segment`. Note: There is no additional latency for segment timestamps,\
                  \ but generating word timestamps incurs additional latency.\n  This option is not available for\
                  \ `gpt-4o-transcribe-diarize`."
                type: array
                items:
                  type: string
                  enum:
                  - word
                  - segment
              known_speaker_names[]:
                type: array
                items:
                  type: string
              known_speaker_references[]:
                type: array
                items:
                  type: string
            required:
            - file
            - model
          encoding:
            chunking_strategy:
              contentType: application/json
            include[]:
              style: form
              explode: true
            timestamp_granularities[]:
              style: form
              explode: true
            known_speaker_names[]:
              style: form
              explode: true
            known_speaker_references[]:
              style: form
              explode: true
    - pointer: '#/paths/~1audio~1translations/post/requestBody/content'
      expected:
        application/json:
          schema:
            type: object
            properties:
              file:
                type: object
                description: 'The audio file object (not file name) translate, in one of these formats: flac, mp3,
