                x-oaiTypeLabel: file
                type: string
                format: binary
              model:
                type: string
                description: The model to use for this transcription request.
                x-oaiTypeLabel: string
              prompt:
                description: An optional text to guide the model's style or continue a previous audio segment. The
                  [prompt](/docs/guides/speech-to-text#prompting) should be in English.
                type: string
              response_format:
                description: 'The format of the output, in one of these options: `json`, `text`, `srt`, `verbose_json`,
