              - "model"
              - "language"
              - "file"
              x-fern-type-name: "AudioTranscriptionsCreateRequest"
      x-fern-examples:
      - code-samples:
        - sdk: "go"
          name: "Cohere Go SDK"
          code: "//go:build ignore\n// +build ignore\n\npackage main\n\nimport (\n\t\"context\"\n\t\"log\"\n\t\"os\"\n\n\taudio \"github.com/cohere-ai/cohere-go/v2/audio\"\n\tclient \"github.com/cohere-ai/cohere-go/v2/client\"\n)\n\nfunc main() {\n\tco := client.NewClient(client.WithToken(os.Getenv(\"CO_API_KEY\")))\n\n\tfile, err := os.Open(\"./sample.wav\")\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\tdefer file.Close()\n\n\ttranscription, err := co.Audio.Transcriptions.Create(\n\t\tcontext.TODO(),\n\t\t&audio.CreateTranscriptionsRequest{\n\t\t\tFile:     file,\n\t\t\tModel:    \"cohere-transcribe-03-2026\",\n\t\t\tLanguage: \"en\",\n\t\t},\n\t)\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\n\tlog.Printf(\"%+v\", transcription)\n}\n"
        - sdk: "python"
          name: "Sync"
          code: "import cohere\n\nco = cohere.ClientV2()\n\ntranscription = co.audio.transcriptions.create(\n    model=\"cohere-transcribe-03-2026\",\n    language=\"en\",\n    file=open(\"./sample.wav\", \"rb\"),\n)\n\nprint(transcription)\n"
        - sdk: "python"
          name: "Async"
          code: "import asyncio\nimport cohere\n\nco = cohere.AsyncClientV2()\n\n\nasync def main():\n    transcription = await co.audio.transcriptions.create(\n        model=\"cohere-transcribe-03-2026\",\n        language=\"en\",\n        file=open(\"./sample.wav\", \"rb\"),\n    )\n\n    print(transcription)\n\n\nasyncio.run(main())\n"
        - sdk: "java"
          name: "Cohere java SDK"
          code: "/* (C)2024 */\nimport com.cohere.api.Cohere;\nimport com.cohere.api.resources.audio.transcriptions.requests.TranscriptionsCreateRequest;\nimport com.cohere.api.resources.audio.transcriptions.types.AudioTranscriptionsCreateResponse;\nimport java.io.File;\n\npublic class TranscriptionsPost {\n  public static void main(String[] args) {\n    Cohere cohere = Cohere.builder().clientName(\"snippet\").build();\n\n    AudioTranscriptionsCreateResponse response =\n        cohere\n            .audio()\n            .transcriptions()\n            .create(\n                new File(\"./sample.wav\"),\n                TranscriptionsCreateRequest.builder()\n                    .model(\"cohere-transcribe-03-2026\")\n                    .language(\"en\")\n                    .build());\n\n    System.out.println(response);\n  }\n}\n"
        - sdk: "typescript"
          name: "Cohere TypeScript SDK"
          code: "import { CohereClientV2 } from 'cohere-ai';\nimport fs from 'fs';\n\nconst cohere = new CohereClientV2({});\n\n(async () => {\n  const fileBuffer = fs.readFileSync('./sample.wav');\n  const file = new File([fileBuffer], 'sample.wav');\n\n  const response = await cohere.audio.transcriptions.create(file, {\n    model: 'cohere-transcribe-03-2026',\n    language: 'en',\n  });\n\n  console.log(response.text);\n})();\n"
        - sdk: "curl"
          name: "cURL"
          code: "curl --request POST \\\n  --url https://api.cohere.com/v2/audio/transcriptions \\\n  --header \"Authorization: Bearer $CO_API_KEY\" \\\n  --form model=cohere-transcribe-03-2026 \\\n  --form language=en \\\n  --form file=@./sample.wav\n"
