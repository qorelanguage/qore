  /v2/parse:
    post:
      summary: "Parse API (v2)"
      operationId: "parsev2"
      x-fern-audiences:
      - "v2-beta"
      x-fern-sdk-group-name: "v2"
      x-fern-sdk-method-name: "parse"
      description: "Parse a document image into structured output. Use `output_format` to select\nblocks or markdown (default).\n\nCurrently supports `document.type = image_url` only (data URI or remote http(s)\nimage URL). PDF / file URL inputs are not yet supported.\n\nImage limits: 20 MB file size; 50 megapixels or 200 MB decoded (whichever is\nexceeded first).\n"
      parameters:
      - $ref: "#/components/parameters/RequestSource"
      x-fern-examples:
      - code-samples:
        - sdk: "go"
          name: "Markdown"
          code: "package main\n\nimport (\n\t\"context\"\n\t\"log\"\n\t\"os\"\n\n\tcohere \"github.com/cohere-ai/cohere-go/v2\"\n\t\"github.com/cohere-ai/cohere-go/v2/client\"\n)\n\nfunc main() {\n\tco := client.NewClient(client.WithToken(os.Getenv(\"CO_API_KEY\")))\n\n\tresp, err := co.V2.Parse(\n\t\tcontext.TODO(),\n\t\t&cohere.ParseRequest{\n\t\t\tModel: \"parse-v5.0\",\n\t\t\tDocument: &cohere.ParseDocument{\n\t\t\t\tImageUrl: \"https://cohere.com/favicon-32x32.png\",\n\t\t\t},\n\t\t\tOutputFormat: cohere.ParseOutputFormatMarkdown.Ptr(),\n\t\t},\n\t)\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\n\tlog.Printf(\"%+v\", resp)\n}\n"
        - sdk: "typescript"
          name: "Markdown"
          code: "import { CohereClient } from 'cohere-ai';\n\nconst cohere = new CohereClient({});\n\n(async () => {\n  const response = await cohere.v2.parse({\n    model: 'parse-v5.0',\n    document: {\n      type: 'image_url',\n      imageUrl: 'https://cohere.com/favicon-32x32.png',\n    },\n    outputFormat: 'markdown',\n  });\n  console.log(response);\n})();\n"
        - sdk: "python"
          name: "Markdown"
          code: "import cohere\n\nco = cohere.ClientV2()\n\nresponse = co.parse(\n    model=\"parse-v5.0\",\n    document={\n        \"type\": \"image_url\",\n        \"image_url\": \"https://cohere.com/favicon-32x32.png\",\n    },\n    output_format=\"markdown\",\n)\n\nprint(response)\n"
        - sdk: "python"
          name: "Markdown (async)"
          code: "import asyncio\n\nimport cohere\n\nco = cohere.AsyncClientV2()\n\n\nasync def main():\n    response = await co.parse(\n        model=\"parse-v5.0\",\n        document={\n            \"type\": \"image_url\",\n            \"image_url\": \"https://cohere.com/favicon-32x32.png\",\n        },\n        output_format=\"markdown\",\n    )\n    print(response)\n\n\nasyncio.run(main())\n"
        - sdk: "java"
          name: "Markdown"
          code: "package parsev2post; /* (C)2024 */\n\nimport com.cohere.api.Cohere;\nimport com.cohere.api.resources.v2.requests.ParseRequest;\nimport com.cohere.api.types.ParseDocument;\nimport com.cohere.api.types.ParseOutputFormat;\nimport com.cohere.api.types.ParseResponse;\n\npublic class Markdown {\n  public static void main(String[] args) {\n    Cohere cohere = Cohere.builder().clientName(\"snippet\").build();\n\n    ParseResponse response =\n        cohere\n            .v2()\n            .parse(\n                ParseRequest.builder()\n                    .model(\"parse-v5.0\")\n                    .document(\n                        ParseDocument.builder()\n                            .imageUrl(\"https://cohere.com/favicon-32x32.png\")\n                            .build())\n                    .outputFormat(ParseOutputFormat.MARKDOWN)\n                    .build());\n\n    System.out.println(response);\n  }\n}\n"
