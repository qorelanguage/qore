      description: "This endpoint returns text embeddings. An embedding is a list of floating point numbers that captures semantic information about the text that it represents.\n\nEmbeddings can be used to create text classifiers as well as empower semantic search. To learn more about embeddings, see the embedding page.\n\nIf you want to learn more how to use the embedding model, have a look at the [Semantic Search Guide](https://docs.cohere.com/docs/semantic-search)."
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              x-fern-audiences:
              - "public"
              required:
              - "model"
              - "input_type"
              properties:
                texts:
                  type: "array"
                  x-fern-audiences:
                  - "public"
                  minItems: 1
                  maxItems: 96
                  description: "An array of strings for the model to embed. Maximum number of texts per call is `96`."
                  items:
                    type: "string"
                    x-fern-audiences:
                    - "public"
                    writeOnly: true
                  writeOnly: true
                images:
                  type: "array"
                  x-fern-audiences:
                  - "public"
                  minItems: 1
                  description: "An array of image data URIs for the model to embed.\n\nThe image must be a valid [data URI](https://developer.mozilla.org/en-US/docs/Web/URI/Schemes/data). The image must be in either `image/jpeg`, `image/png`, `image/webp`, or `image/gif` format.\n\nImage embeddings are supported with Embed v3.0 and newer models.\n\nFor **Embed v3.x** models, the maximum number of images per call is `1`, and each image has a maximum size of `5MB`.\n\nFor **Embed v4.0 and newer** models, there is no limit on the number of images per call. The combined size of all images in the request must be at most `20MB`."
                  items:
                    type: "string"
                    x-fern-audiences:
                    - "public"
                    writeOnly: true
                model:
                  type: "string"
                  x-fern-audiences:
                  - "public"
                  description: "ID of one of the available [Embedding models](https://docs.cohere.com/docs/cohere-embed)."
                  writeOnly: true
                input_type:
                  x-fern-audiences:
                  - "public"
                  $ref: "#/components/schemas/EmbedInputType"
                inputs:
                  type: "array"
                  x-fern-audiences:
                  - "public"
                  items:
                    $ref: "#/components/schemas/EmbedInput"
                  description: "An array of inputs for the model to embed. Maximum number of inputs per call is `96`. An input can contain a mix of text and image components."
                max_tokens:
                  type: "integer"
                  x-fern-audiences:
                  - "public"
                  description: "The maximum number of tokens to embed per input. If the input text is longer than this, it will be truncated according to the `truncate` parameter."
                output_dimension:
                  type: "integer"
                  x-fern-audiences:
                  - "public"
                  description: "The number of dimensions of the output embedding. This is only available for `embed-v4` and newer models.\nPossible values are `256`, `512`, `1024`, and `1536`. The default is `1536`."
                embedding_types:
                  type: "array"
                  x-fern-audiences:
                  - "public"
                  items:
                    $ref: "#/components/schemas/EmbeddingType"
                  description: "Specifies the types of embeddings you want to get back. Can be one or more of the following types.\n\n* `\"float\"`: Use this when you want to get back the default float embeddings. Supported with all Embed models.\n* `\"int8\"`: Use this when you want to get back signed int8 embeddings. Supported with Embed v3.0 and newer Embed models.\n* `\"uint8\"`: Use this when you want to get back unsigned int8 embeddings. Supported with Embed v3.0 and newer Embed models.\n* `\"binary\"`: Use this when you want to get back signed binary embeddings. Supported with Embed v3.0 and newer Embed models.\n* `\"ubinary\"`: Use this when you want to get back unsigned binary embeddings. Supported with Embed v3.0 and newer Embed models.\n* `\"base64\"`: Use this when you want to get back base64 embeddings. Supported with Embed v3.0 and newer Embed models."
                  writeOnly: true
                  default:
                  - "float"
                truncate:
                  type: "string"
                  x-fern-audiences:
                  - "public"
                  default: "END"
                  enum:
                  - "NONE"
                  - "START"
                  - "END"
                  description: "One of `NONE|START|END` to specify how the API will handle inputs longer than the maximum token length.\n\nPassing `START` will discard the start of the input. `END` will discard the end of the input. In both cases, input is discarded until the remaining input is exactly the maximum input token length for the model.\n\nIf `NONE` is selected, when the input exceeds the maximum input token length an error will be returned."
                  writeOnly: true
                priority:
                  x-fern-audiences:
                  - "public"
                  type: "integer"
                  default: 0
                  minimum: 0
                  maximum: 999
                  description: "Controls how early the request is handled. Lower numbers indicate higher priority (default: 0, the highest). When the system is under load, higher-priority requests are processed first and are the least likely to be dropped."
              x-fern-type-name: "V2EmbedRequest"
        description: ""
  /v2/audio/transcriptions:
    post:
      x-fern-audiences:
      - "public"
      summary: "Create a transcription"
      operationId: "create-transcription"
      description: "Transcribe an audio file."
      tags:
      - "/audio/transcriptions"
      x-fern-sdk-group-name:
      - "audio"
      - "transcriptions"
      x-fern-sdk-method-name: "create"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: "object"
              x-fern-audiences:
              - "public"
              properties:
                model:
                  type: "string"
                  x-fern-audiences:
                  - "public"
                  description: "ID of the model to use."
                language:
                  type: "string"
                  x-fern-audiences:
                  - "public"
                  description: "The language of the input audio, supplied in [ISO-639-1](https://en.wikipedia.org/wiki/List_of_ISO_639_language_codes) format."
                temperature:
                  type: "number"
                  x-fern-audiences:
                  - "public"
                  description: "The sampling temperature, between 0 and 1. Higher values like 0.8 make the output more random, while lower values like 0.2 make it more focused and deterministic."
                file:
                  type: "string"
                  x-fern-audiences:
                  - "public"
                  format: "binary"
                  description: "The audio file object to transcribe. Supported file extensions are flac, mp3, mpeg, mpga, ogg, and wav."
