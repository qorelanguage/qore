  /v2/rerank:
    post:
      summary: "Rerank API (v2)"
      operationId: "rerankv2"
      x-fern-audiences:
      - "v2-beta"
      x-fern-sdk-group-name: "v2"
      x-fern-sdk-method-name: "rerank"
      parameters:
      - $ref: "#/components/parameters/RequestSource"
      responses:
        200:
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                x-fern-audiences:
                - "public"
                properties:
                  id:
                    type: "string"
                    x-fern-audiences:
                    - "public"
                  results:
                    type: "array"
                    x-fern-audiences:
                    - "public"
                    description: "An ordered list of ranked documents"
                    items:
                      type: "object"
                      x-fern-audiences:
                      - "public"
                      properties:
                        index:
                          type: "integer"
                          x-fern-audiences:
                          - "public"
                          description: "Corresponds to the index in the original list of documents to which the ranked document belongs. (i.e. if the first value in the `results` object has an `index` value of 3, it means in the list of documents passed in, the document at `index=3` had the highest relevance)"
                        relevance_score:
                          type: "number"
                          x-fern-audiences:
                          - "public"
                          format: "float"
                          description: "Relevance scores are normalized to be in the range `[0, 1]`. Scores close to `1` indicate a high relevance to the query, and scores closer to `0` indicate low relevance. It is not accurate to assume a score of 0.9 means the document is 2x more relevant than a document with a score of 0.45"
                      required:
                      - "index"
                      - "relevance_score"
                      x-fern-type-name: "V2RerankResponseResultsItem"
                  meta:
                    $ref: "#/components/schemas/ApiMeta"
                    x-fern-audiences:
                    - "public"
                required:
                - "results"
                x-fern-type-name: "V2RerankResponse"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/UnprocessableEntity"
        429:
          $ref: "#/components/responses/RateLimit"
        498:
          $ref: "#/components/responses/InvalidToken"
        499:
          $ref: "#/components/responses/RequestCancelled"
        500:
          $ref: "#/components/responses/InternalServerError"
        501:
          $ref: "#/components/responses/NotImplemented"
        503:
          $ref: "#/components/responses/ServiceUnavailable"
        504:
          $ref: "#/components/responses/GatewayTimeout"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              x-fern-audiences:
              - "public"
              properties:
                model:
                  type: "string"
                  x-fern-audiences:
                  - "public"
                  description: "The identifier of the model to use, eg `rerank-v3.5`."
                query:
                  type: "string"
                  x-fern-audiences:
                  - "public"
                  description: "The search query"
                documents:
                  type: "array"
                  x-fern-audiences:
                  - "public"
                  description: "A list of texts that will be compared to the `query`.\nFor optimal performance we recommend against sending more than 1,000 documents in a single request.\n\n**Note**: long documents will automatically be truncated to the value of `max_tokens_per_doc`.\n\n**Note**: structured data should be formatted as YAML strings for best performance."
                  items:
                    type: "string"
                top_n:
                  type: "integer"
                  x-fern-audiences:
                  - "public"
                  minimum: 1
                  description: "Limits the number of returned rerank results to the specified value. If not passed, all the rerank results will be returned."
                max_tokens_per_doc:
                  type: "integer"
                  x-fern-audiences:
                  - "public"
                  description: "Defaults to `4096`. Long documents will be automatically truncated to the specified number of tokens."
                priority:
                  x-fern-audiences:
                  - "public"
                  type: "integer"
                  default: 0
                  minimum: 0
                  maximum: 999
                  description: "Controls how early the request is handled. Lower numbers indicate higher priority (default: 0, the highest). When the system is under load, higher-priority requests are processed first and are the least likely to be dropped."
              required:
              - "query"
              - "documents"
              - "model"
              x-fern-type-name: "V2RerankRequest"
        description: ""
      description: "This endpoint takes in a query and a list of texts and produces an ordered array with each text assigned a relevance score."
      x-fern-examples:
      - code-samples:
        - sdk: "typescript"
          name: "Cohere TypeScript SDK"
          code: "import { CohereClient } from 'cohere-ai';\n\nconst cohere = new CohereClient({});\n\n(async () => {\n  const rerank = await cohere.v2.rerank({\n    documents: [\n      'Carson City is the capital city of the American state of Nevada.',\n      'The Commonwealth of the Northern Mariana Islands is a group of islands in the Pacific Ocean. Its capital is Saipan.',\n      'Capitalization or capitalisation in English grammar is the use of a capital letter at the start of a word. English usage varies from capitalization in other languages.',\n      'Washington, D.C. (also known as simply Washington or D.C., and officially as the District of Columbia) is the capital of the United States. It is a federal district.',\n      'Capital punishment has existed in the United States since beforethe United States was a country. As of 2017, capital punishment is legal in 30 of the 50 states.',\n    ],\n    query: 'What is the capital of the United States?',\n    topN: 3,\n    model: 'rerank-v4.0-pro',\n  });\n\n  console.log(rerank);\n})();\n"
        - sdk: "python"
          name: "Sync"
          code: "import cohere\n\nco = cohere.ClientV2()\n\ndocs = [\n    \"Carson City is the capital city of the American state of Nevada.\",\n    \"The Commonwealth of the Northern Mariana Islands is a group of islands in the Pacific Ocean. Its capital is Saipan.\",\n    \"Capitalization or capitalisation in English grammar is the use of a capital letter at the start of a word. English usage varies from capitalization in other languages.\",\n    \"Washington, D.C. (also known as simply Washington or D.C., and officially as the District of Columbia) is the capital of the United States. It is a federal district.\",\n    \"Capital punishment has existed in the United States since beforethe United States was a country. As of 2017, capital punishment is legal in 30 of the 50 states.\",\n]\n\nresponse = co.rerank(\n    model=\"rerank-v4.0-pro\",\n    query=\"What is the capital of the United States?\",\n    documents=docs,\n    top_n=3,\n)\nprint(response)\n"
        - sdk: "python"
          name: "Async"
          code: "import cohere\nimport asyncio\n\nco = cohere.AsyncClientV2()\n\nasync def main():\n    response = await co.rerank(\n        model=\"rerank-v4.0-pro\",\n        query=\"What is the capital of the United States?\",\n        documents=[\n            \"Carson City is the capital city of the American state of Nevada.\",\n            \"The Commonwealth of the Northern Mariana Islands is a group of islands in the Pacific Ocean. Its capital is Saipan.\",\n            \"Capitalization or capitalisation in English grammar is the use of a capital letter at the start of a word. English usage varies from capitalization in other languages.\",\n            \"Washington, D.C. (also known as simply Washington or D.C., and officially as the District of Columbia) is the capital of the United States. It is a federal district.\",\n            \"Capital punishment has existed in the United States since beforethe United States was a country. As of 2017, capital punishment is legal in 30 of the 50 states.\",\n        ],\n        top_n=3\n    )\n    print(response)\n\n\nasyncio.run(main())\n"
        - sdk: "java"
          name: "Cohere java SDK"
          code: "/* (C)2024 */\nimport com.cohere.api.Cohere;\nimport com.cohere.api.resources.v2.requests.V2RerankRequest;\nimport com.cohere.api.resources.v2.types.V2RerankResponse;\nimport java.util.List;\n\npublic class RerankV2Post {\n  public static void main(String[] args) {\n    Cohere cohere = Cohere.builder().clientName(\"snippet\").build();\n\n    V2RerankResponse response =\n        cohere\n            .v2()\n            .rerank(\n                V2RerankRequest.builder()\n                    .model(\"rerank-v4.0-pro\")\n                    .query(\"What is the capital of the United States?\")\n                    .documents(\n                        List.of(\n                            \"Carson City is the capital city of the American state of Nevada.\",\n                            \"The Commonwealth of the Northern Mariana Islands is a group of islands\"\n                                + \" in the Pacific Ocean. Its capital is Saipan.\",\n                            \"Capitalization or capitalisation in English grammar is the use of a\"\n                                + \" capital letter at the start of a word. English usage varies\"\n                                + \" from capitalization in other languages.\",\n                            \"Washington, D.C. (also known as simply Washington or D.C., and\"\n                                + \" officially as the District of Columbia) is the capital of the\"\n                                + \" United States. It is a federal district.\",\n                            \"Capital punishment has existed in the United States since before the\"\n                                + \" United States was a country. As of 2017, capital punishment is\"\n                                + \" legal in 30 of the 50 states.\"))\n                    .topN(3)\n                    .build());\n\n    System.out.println(response);\n  }\n}\n"
        - sdk: "curl"
          name: "cURL"
          code: "curl --request POST \\\n  --url https://api.cohere.com/v2/rerank \\\n  --header 'accept: application/json' \\\n  --header 'content-type: application/json' \\\n  --header \"Authorization: bearer $CO_API_KEY\" \\\n  --data '{\n    \"model\": \"rerank-v4.0-pro\",\n    \"query\": \"What is the capital of the United States?\",\n    \"top_n\": 3,\n    \"documents\": [\"Carson City is the capital city of the American state of Nevada.\",\n                  \"The Commonwealth of the Northern Mariana Islands is a group of islands in the Pacific Ocean. Its capital is Saipan.\",\n                  \"Washington, D.C. (also known as simply Washington or D.C., and officially as the District of Columbia) is the capital of the United States. It is a federal district.\",\n                  \"Capitalization or capitalisation in English grammar is the use of a capital letter at the start of a word. English usage varies from capitalization in other languages.\",\n                  \"Capital punishment has existed in the United States since beforethe United States was a country. As of 2017, capital punishment is legal in 30 of the 50 states.\"]\n  }'\n"
        request:
          documents:
          - "Carson City is the capital city of the American state of Nevada."
          - "The Commonwealth of the Northern Mariana Islands is a group of islands in the Pacific Ocean. Its capital is Saipan."
          - "Capitalization or capitalisation in English grammar is the use of a capital letter at the start of a word. English usage varies from capitalization in other languages."
          - "Washington, D.C. (also known as simply Washington or D.C., and officially as the District of Columbia) is the capital of the United States. It is a federal district."
          - "Capital punishment has existed in the United States since beforethe United States was a country. As of 2017, capital punishment is legal in 30 of the 50 states."
          query: "What is the capital of the United States?"
          top_n: 3
          model: "rerank-v4.0-pro"
        response:
          body:
            id: "07734bd2-2473-4f07-94e1-0d9f0e6843cf"
            results:
            - index: 3
              relevance_score: 0.999071
            - index: 4
              relevance_score: 0.7867866999999999499948444
            - index: 0
              relevance_score: 0.3271306800000000070127726
            meta:
              api_version:
                version: "2"
                is_experimental: false
              billed_units:
                search_units: 1
