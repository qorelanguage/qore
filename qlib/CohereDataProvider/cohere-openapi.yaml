          x-fern-audiences:
          - "public"
          properties:
            input_tokens:
              type: "number"
              x-fern-audiences:
              - "public"
              description: "The number of tokens used as input to the model.\n"
            output_tokens:
              type: "number"
              x-fern-audiences:
              - "public"
              description: "The number of tokens produced by the model.\n"
