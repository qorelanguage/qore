      - "id"
      - "pages"
      properties:
        id:
          type: "string"
          description: "Unique identifier for the parse response."
        pages:
          type: "array"
          description: "Parsed pages in document order."
          items:
            $ref: "#/components/schemas/ParsePage"
        meta:
          $ref: "#/components/schemas/ApiMeta"
      x-fern-type-name: "ParseResponse"
    EmbedInputType:
      type: "string"
      enum:
      - "search_document"
      - "search_query"
      - "classification"
      - "clustering"
      - "image"
      description: "Specifies the type of input passed to the model. Required for embedding models v3 and higher.\n\n- `\"search_document\"`: Used for embeddings stored in a vector database for search use-cases.\n- `\"search_query\"`: Used for embeddings of search queries run against a vector DB to find relevant documents.\n- `\"classification\"`: Used for embeddings passed through a text classifier.\n- `\"clustering\"`: Used for the embeddings run through a clustering algorithm.\n- `\"image\"`: Used for embeddings with image input.\n"
      x-fern-type-name: "EmbedInputType"
    EmbeddingType:
      x-fern-audiences:
      - "public"
      type: "string"
      writeOnly: true
      enum:
      - "float"
      - "int8"
      - "uint8"
      - "binary"
      - "ubinary"
      - "base64"
      x-fern-type-name: "EmbeddingType"
    Image:
      type: "object"
      required:
      - "width"
      - "height"
      - "format"
      - "bit_depth"
      properties:
        width:
          type: "number"
          format: "int64"
          description: "Width of the image in pixels"
          x-fern-audiences:
          - "public"
        height:
          type: "number"
          format: "int64"
          description: "Height of the image in pixels"
          x-fern-audiences:
          - "public"
        format:
          type: "string"
          description: "Format of the image"
          x-fern-audiences:
          - "public"
        bit_depth:
          type: "number"
          format: "int64"
          description: "Bit depth of the image"
          x-fern-audiences:
          - "public"
      x-fern-type-name: "Image"
    EmbedByTypeResponse:
      type: "object"
      required:
      - "id"
      - "embeddings"
      properties:
        response_type:
          type: "string"
          x-fern-audiences:
          - "public"
          enum:
          - "embeddings_floats"
          - "embeddings_by_type"
        id:
          type: "string"
          x-fern-audiences:
          - "public"
        embeddings:
          type: "object"
          x-fern-audiences:
          - "public"
          description: "An object with different embedding types. The length of each embedding type array will be the same as the length of the original `texts` array."
          properties:
            float:
              type: "array"
              x-fern-audiences:
              - "public"
              description: "An array of float embeddings."
              items:
                type: "array"
                x-fern-audiences:
                - "public"
                items:
                  type: "number"
                  x-fern-audiences:
                  - "public"
            int8:
              type: "array"
              x-fern-audiences:
              - "public"
              description: "An array of signed int8 embeddings. Each value is between -128 and 127."
              items:
                type: "array"
                x-fern-audiences:
                - "public"
                items:
                  type: "integer"
                  x-fern-audiences:
                  - "public"
            uint8:
              type: "array"
              x-fern-audiences:
              - "public"
              description: "An array of unsigned int8 embeddings. Each value is between 0 and 255."
              items:
                type: "array"
                x-fern-audiences:
                - "public"
                items:
                  type: "integer"
                  x-fern-audiences:
                  - "public"
            binary:
              type: "array"
              x-fern-audiences:
              - "public"
              description: "An array of packed signed binary embeddings. The length of each binary embedding is 1/8 the length of the float embeddings of the provided model. Each value is between -128 and 127."
              items:
                type: "array"
                x-fern-audiences:
                - "public"
                items:
                  type: "integer"
                  x-fern-audiences:
                  - "public"
            ubinary:
              type: "array"
              x-fern-audiences:
              - "public"
              description: "An array of packed unsigned binary embeddings. The length of each binary embedding is 1/8 the length of the float embeddings of the provided model. Each value is between 0 and 255."
              items:
                type: "array"
                x-fern-audiences:
                - "public"
                items:
                  type: "integer"
                  x-fern-audiences:
                  - "public"
            base64:
              type: "array"
              x-fern-audiences:
              - "public"
              description: "An array of base64 embeddings. Each string is the result of appending the float embedding bytes together and base64 encoding that."
              items:
                type: "string"
                x-fern-audiences:
                - "public"
          items:
            type: "array"
            x-fern-audiences:
            - "public"
            items:
              type: "number"
              x-fern-audiences:
              - "public"
