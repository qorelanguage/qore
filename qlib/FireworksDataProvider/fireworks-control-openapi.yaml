    gatewayBatchInferenceJob:
      type: "object"
      properties:
        name:
          type: "string"
          title: "The resource name of the batch inference job. e.g. accounts/my-account/batchInferenceJobs/my-batch-inference-job"
          readOnly: true
        displayName:
          type: "string"
          title: "Human-readable display name of the batch inference job. e.g. \"My Batch Inference Job\""
        createTime:
          type: "string"
          format: "date-time"
          description: "The creation time of the batch inference job."
          readOnly: true
        expireTime:
          type: "string"
          format: "date-time"
          description: "The time when the batch inference job will expire (stop running); any\ncompleted requests will have been written to the output dataset by then.\n\nThis is the job's effective execution deadline, derived by the server as\ncreate_time + the bounded run window (see max_job_duration). It is exposed\nso customers can read back the concrete deadline without recomputing it\nclient-side. OUTPUT_ONLY: it is always computed server-side and any\nclient-supplied value is ignored (previously this was a SUPERUSER_ONLY\ninput that overlapped with max_job_duration; the two are now unified as one\npublic input (duration) + one public derived deadline (this timestamp))."
          readOnly: true
        createdBy:
          type: "string"
          description: "The email address of the user who initiated this batch inference job."
          readOnly: true
        state:
          $ref: "#/components/schemas/gatewayJobState"
          description: "JobState represents the state an asynchronous job can be in."
          readOnly: true
        status:
          $ref: "#/components/schemas/gatewayStatus"
          readOnly: true
        model:
          type: "string"
          description: "The name of the model to use for inference. This is required, except when continued_from_job_name is specified."
        inputDatasetId:
          type: "string"
          description: "The name of the dataset used for inference. This is required, except when continued_from_job_name is specified."
        outputDatasetId:
          type: "string"
          description: "The name of the dataset used for storing the results. This will also contain the error file."
        systemPrompt:
          type: "string"
          description: "Optional job-level system prompt. When set, it is injected as a leading\nsystem message into every input row that does NOT already begin with a\nsystem message (a row's own leading system message takes precedence). This\nlets callers avoid repeating a large, static system prompt on every row of\nthe input dataset, shrinking the upload. Because the injected prefix is\nbyte-identical across rows, prompt caching still applies."
        inferenceParameters:
          $ref: "#/components/schemas/gatewayBatchInferenceJobInferenceParameters"
          description: "Parameters controlling the inference process."
        updateTime:
          type: "string"
          format: "date-time"
          description: "The update time for the batch inference job."
          readOnly: true
        precision:
          $ref: "#/components/schemas/DeploymentPrecision"
          description: "The precision with which the model should be served.\nIf PRECISION_UNSPECIFIED, a default will be chosen based on the model."
        jobProgress:
          $ref: "#/components/schemas/gatewayJobProgress"
          description: "Job progress."
          readOnly: true
        continuedFromJobName:
          type: "string"
          description: "The resource name of the batch inference job that this job continues from.\nUsed for lineage tracking to understand job continuation chains."
        placement:
          $ref: "#/components/schemas/gatewayPlacement"
          description: "The desired geographic region where the batch inference job runs.\nSet `multi_region` to limit the job to a region group (US, EUROPE,\nAPAC, or GLOBAL). If unspecified, the job runs in any supported region."
        maxJobDuration:
          type: "string"
          description: "The customer-requested wall-clock run window for the job: how long it may\nrun before it is expired. This is the single public input that controls the\njob's lifetime. The server bounds it to [12h, 72h]; if unset it defaults to\n24h. The resulting concrete deadline is surfaced as expire_time\n(= create_time + the bounded window) and the job is expired once that\ndeadline passes. A duration (relative) is used rather than an absolute\ntimestamp because the client does not know create_time at submit time.\nCustomer-visible input."
        lifecycle:
          $ref: "#/components/schemas/BatchInferenceJobLifecycleTimestamps"
          description: "Lifecycle milestone timestamps (validated / run-start / end) for the job."
          readOnly: true
        waitingOnCapacity:
          type: "boolean"
          description: "True only while a job that has ALREADY started running is briefly\nre-acquiring capacity after a mid-run preemption/stockout (i.e. it\nregressed from RUNNING back to an internal PENDING/CREATING phase and is\nwaiting to resume). This is intentionally a transient sub-status annotation\non a job whose customer-facing `state` stays RUNNING — NOT a distinct\n`state` value: the job is still running (progress is saved, it auto-resumes)\nso introducing a new terminal-or-not enum value would force every state\nconsumer (SDK/CLI/internal maps/billing) to special-case \"still running.\"\nIt drives the customer-facing \"Briefly paused — waiting on capacity\" card.\nIt must NOT be set during first-time provisioning before the job has ever\nrun, and is cleared once the job returns to RUNNING or reaches a terminal\nstate. So \"state=RUNNING, waiting_on_capacity=true\" means: running, momentarily\npaused while it re-acquires capacity."
          readOnly: true
    gatewayBatchInferenceJobInferenceParameters:
      type: "object"
      properties:
        maxTokens:
          type: "integer"
          format: "int32"
          description: "Maximum number of tokens to generate per response."
        temperature:
          type: "number"
          format: "float"
          description: "Sampling temperature, typically between 0 and 2."
        topP:
          type: "number"
          format: "float"
          description: "Top-p sampling parameter, typically between 0 and 1."
        n:
          type: "integer"
          format: "int32"
          description: "Number of response candidates to generate per input."
        extraBody:
          type: "string"
          description: "Additional parameters for the inference request as a JSON string.\nFor example: \"{\\\"stop\\\": [\\\"\\\\n\\\"]}\"."
        topK:
          type: "integer"
          format: "int32"
          description: "Top-k sampling parameter, limits the token selection to the top k tokens."
      title: "BIJ inference parameters"
    gatewayBillingSettings:
      type: "object"
      properties:
        name:
          type: "string"
          title: "Resource name, e.g. accounts/my-account/billingSettings"
          readOnly: true
        updateTime:
          type: "string"
          format: "date-time"
          description: "The time the billing settings were last updated."
          readOnly: true
