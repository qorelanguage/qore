openapi: "3.1.0"
info:
  title: "Gateway REST API"
  version: "5.10.0"
tags:
- name: "AccountService"
- name: "DeploymentService"
- name: "Gateway"
- name: "ModelService"
- name: "TrainingService"
paths:
  /v1/accounts:
    get:
      summary: "List Accounts"
      operationId: "Gateway_ListAccounts"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gatewayListAccountsResponse"
      parameters:
      - name: "pageSize"
        description: "The maximum number of accounts to return. The maximum page_size is 200,\nvalues above 200 will be coerced to 200.\nIf unspecified, the default is 50."
        in: "query"
        required: false
        schema:
          type: "integer"
          format: "int32"
      - name: "pageToken"
        description: "A page token, received from a previous ListAccounts call. Provide this\nto retrieve the subsequent page. When paginating, all other parameters\nprovided to ListAccounts must match the call that provided the page\ntoken."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "filter"
        description: "Only accounts satisfying the provided filter (if specified) will be\nreturned. See https://google.aip.dev/160 for the filter grammar."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "orderBy"
        description: "Not supported.\nAccounts will be returned ordered by `name`."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "readMask"
        description: "The fields to be returned in the response. If empty or \"*\", all fields will be returned."
        in: "query"
        required: false
        schema:
          type: "string"
      tags:
      - "Gateway"
  /v1/accounts/{account_id}:
    get:
      summary: "Get Account"
      operationId: "Gateway_GetAccount"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gatewayAccount"
      parameters:
      - name: "readMask"
        description: "The fields to be returned in the response. If empty or \"*\", all fields will be returned."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "account_id"
        in: "path"
        required: true
        description: "The Account Id"
        schema:
          type: "string"
      tags:
      - "Gateway"
  /v1/accounts/{account_id}/accountUsageFilterOptions:
    get:
      summary: "Distinct filter values for an account/time range (serverless + dedicated; for FE, separate -yet mirrors GetAccountUsage)."
      operationId: "Gateway_GetAccountUsageFilterOptions"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gatewayGetAccountUsageFilterOptionsResponse"
      parameters:
      - name: "startTime"
        in: "query"
        required: true
        schema:
          type: "string"
          format: "date-time"
      - name: "endTime"
        in: "query"
        required: true
        schema:
          type: "string"
          format: "date-time"
      - name: "usageType"
        description: "If not specified, loads filter options for serverless and dedicated usage only.\n\n - SERVERLESS: Serverless filter dimensions only (model_name, api_key_id, api_key_name, user_id, session_id, annotations.*).\n - DEDICATED_DEPLOYMENT: Dedicated deployment filter dimensions (deployment_name, annotations.team, .project, .environment).\n - TRAINING: Training filter dimensions (job_id, training_session_id, job_type,\nusage_type, accelerator_type, base_model)."
        in: "query"
        required: false
        schema:
          type: "string"
          enum:
          - "USAGE_TYPE_UNSPECIFIED"
          - "SERVERLESS"
          - "DEDICATED_DEPLOYMENT"
          - "TRAINING"
          default: "USAGE_TYPE_UNSPECIFIED"
      - name: "account_id"
        in: "path"
        required: true
        description: "The Account Id"
        schema:
          type: "string"
      tags:
      - "Gateway"
  /v1/accounts/{account_id}/auditLogs:
    get:
      summary: "List User Audit Logs"
      operationId: "Gateway_ListAuditLogs"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gatewayListAuditLogsResponse"
      parameters:
      - name: "startTime"
        description: "Start time of the audit logs to retrieve.\nIf unspecified, the default is 30 days before now."
        in: "query"
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "endTime"
        description: "End time of the audit logs to retrieve.\nIf unspecified, the default is the current time."
        in: "query"
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "email"
        description: "Optional.\nFilter audit logs for user email associated with the account."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "pageSize"
        description: "The maximum number of audit logs to return. The maximum page_size is 200,\nvalues above 200 will be coerced to 200.\nIf unspecified, the default is 10."
        in: "query"
        required: false
        schema:
          type: "integer"
          format: "int32"
      - name: "pageToken"
        description: "A page token, received from a previous ListAuditLogs call. Provide this\nto retrieve the subsequent page. When paginating, all other parameters\nprovided to ListAuditLogs must match the call that provided the page\ntoken."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "filter"
        description: "Optional. An AIP-160 filter expression (https://google.aip.dev/160) over the fields `message`, `resource`, `email`, `api_key_id`, `event_type`, and `target_api_key_id`. Use `=` for an exact match and `:` for a substring match, for example `email=\"user@example.com\"` or `message:\"Create\"`."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "orderBy"
        description: "Unused. Audit log entries are always returned ordered by timestamp descending (newest first)."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "readMask"
        description: "The fields to be returned in the response. If empty or \"*\", all fields will be returned."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "account_id"
        in: "path"
        required: true
        description: "The Account Id"
        schema:
          type: "string"
      tags:
      - "Gateway"
  /v1/accounts/{account_id}/batchInferenceJobs:
    get:
      summary: "List Batch Inference Jobs"
      operationId: "Gateway_ListBatchInferenceJobs"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gatewayListBatchInferenceJobsResponse"
      parameters:
      - name: "pageSize"
        description: "The maximum number of batch inference jobs to return. The maximum page_size is 200,\nvalues above 200 will be coerced to 200.\nIf unspecified, the default is 50."
        in: "query"
        required: false
        schema:
          type: "integer"
          format: "int32"
      - name: "pageToken"
        description: "A page token, received from a previous ListBatchInferenceJobs call. Provide this\nto retrieve the subsequent page. When paginating, all other parameters\nprovided to ListBatchInferenceJobs must match the call that provided the page\ntoken."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "filter"
        description: "Only jobs satisfying the provided filter (if specified) will be\nreturned. See https://google.aip.dev/160 for the filter grammar."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "orderBy"
        description: "A comma-separated list of fields to order by. e.g. \"foo,bar\"\nThe default sort order is ascending. To specify a descending order for a\nfield, append a \" desc\" suffix. e.g. \"foo desc,bar\"\nSubfields are specified with a \".\" character. e.g. \"foo.bar\"\nIf not specified, the default order is by \"created_time\"."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "readMask"
        description: "The fields to be returned in the response. If empty or \"*\", all fields will be returned."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "account_id"
        in: "path"
        required: true
        description: "The Account Id"
        schema:
          type: "string"
      tags:
      - "Gateway"
    post:
      summary: "Create Batch Inference Job"
      operationId: "Gateway_CreateBatchInferenceJob"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gatewayBatchInferenceJob"
      parameters:
      - name: "batchInferenceJobId"
        description: "ID of the batch inference job."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "account_id"
        in: "path"
        required: true
        description: "The Account Id"
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/gatewayBatchInferenceJob"
        required: true
      tags:
      - "Gateway"
  /v1/accounts/{account_id}/batchInferenceJobs/{batch_inference_job_id}:
    get:
      summary: "Get Batch Inference Job"
      operationId: "Gateway_GetBatchInferenceJob"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gatewayBatchInferenceJob"
      parameters:
      - name: "readMask"
        description: "The fields to be returned in the response. If empty or \"*\", all fields will be returned."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "account_id"
        in: "path"
        required: true
        description: "The Account Id"
        schema:
          type: "string"
      - name: "batch_inference_job_id"
        in: "path"
        required: true
        description: "The Batch Inference Job Id"
        schema:
          type: "string"
      tags:
      - "Gateway"
    delete:
      summary: "Delete Batch Inference Job"
      operationId: "Gateway_DeleteBatchInferenceJob"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                type: "object"
                properties: {}
      parameters:
      - name: "account_id"
        in: "path"
        required: true
        description: "The Account Id"
        schema:
          type: "string"
      - name: "batch_inference_job_id"
        in: "path"
        required: true
        description: "The Batch Inference Job Id"
        schema:
          type: "string"
      tags:
      - "Gateway"
  /v1/accounts/{account_id}/billing/summary:
    get:
      summary: "Get billing summary information for an account"
      operationId: "Gateway_GetBillingSummary"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gatewayGetBillingSummaryResponse"
      parameters:
      - name: "startTime"
        description: "Start time for the billing period.\nNote: Costs are aggregated daily. Only the date portion (YYYY-MM-DD) is used;\nthe time portion is ignored. For example, 2025-10-05T07:18:29Z and\n2025-10-05T23:59:59Z are treated the same as 2025-10-05T00:00:00Z."
        in: "query"
        required: true
        schema:
          type: "string"
          format: "date-time"
      - name: "endTime"
        description: "End time for the billing period (exclusive).\nNote: Costs are aggregated daily. Only the date portion (YYYY-MM-DD) is used;\nthe time portion is ignored. Costs for the end date are NOT included.\nFor example, to get costs for Oct 5 and Oct 6, use:\n  start_time: 2025-10-05T00:00:00Z\n  end_time: 2025-10-07T00:00:00Z (Oct 7 is excluded)"
        in: "query"
        required: true
        schema:
          type: "string"
          format: "date-time"
      - name: "granularity"
        description: "Requested breakdown granularity. Defaults to UNSPECIFIED (no breakdown)."
        in: "query"
        required: false
        schema:
          type: "string"
          enum:
          - "GRANULARITY_UNSPECIFIED"
          - "DAILY"
          default: "GRANULARITY_UNSPECIFIED"
      - name: "account_id"
        in: "path"
        required: true
        description: "The Account Id"
        schema:
          type: "string"
      tags:
      - "Gateway"
  /v1/accounts/{account_id}/usageCosts:query:
    post:
      summary: "Query grouped usage cost subtotals for an account."
      description: "Returns rated dollar subtotals for usage over a time range, grouped by up to two of: HOUR, DAY, MODEL, USER, or API_KEY. Unlike `GET /billingUsage` (metered quantities) and `GET /billing/summary` (line items by billing category), this endpoint returns *rated costs* broken down by caller-supplied dimensions, with pagination and an account-wide `subtotal`. Requires account administrator access for `ACCOUNT` scope; `SELF` scope returns costs for the authenticated principal only."
      operationId: "Gateway_QueryUsageCosts"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gatewayQueryUsageCostsResponse"
      parameters:
      - name: "account_id"
        in: "path"
        required: true
        description: "The Account Id"
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/gatewayGatewayQueryUsageCostsBody"
        required: true
      tags:
      - "Gateway"
  /v1/accounts/{account_id}/billingSettings:
    get:
      summary: "Returns the singleton BillingSettings for the given account."
      operationId: "Gateway_GetBillingSettings"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gatewayBillingSettings"
      parameters:
      - name: "readMask"
        description: "The fields to be returned in the response. If empty or \"*\", all fields will be returned."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "account_id"
        in: "path"
        required: true
        description: "The Account Id"
        schema:
          type: "string"
      tags:
      - "Gateway"
  /v1/accounts/{account_id}/billingUsage:
    get:
      summary: "Get Account Usage"
      operationId: "Gateway_GetAccountUsage"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gatewayAccountUsage"
      parameters:
      - name: "startTime"
        description: "Costs returned are inclusive of `start_time`.\nstart_time must be before end_time."
        in: "query"
        required: true
        schema:
          type: "string"
          format: "date-time"
      - name: "endTime"
        description: "Costs returned are exclusive of `end_time`.\nend_time must not be more than 31 days after start_time."
        in: "query"
        required: true
        schema:
          type: "string"
          format: "date-time"
      - name: "usageType"
        description: "Usage type to query usage for\nIf not specified, returns all usage types (serverless, dedicated deployments, and training).\n\n - USAGE_TYPE_UNSPECIFIED: Default value. When specified (or when usage_type field is not set),\nreturns usage data for all deployment types: serverless requests, dedicated deployments,\nand training jobs.\n - SERVERLESS: Returns only serverless usage data.\nFilters the response to include only usage from serverless API requests.\n - DEDICATED_DEPLOYMENT: Returns only dedicated deployment usage data.\nFilters the response to include only usage from dedicated deployments.\n - TRAINING: Returns only training job usage data (SFT/DPO token usage and RFT / service-mode\ntrainer GPU-seconds usage). Inference deployments serving rollouts for RFT /\nonline RL are reported under DEDICATED_DEPLOYMENT (not TRAINING) to avoid\ndouble counting GPU time."
        in: "query"
        required: false
        schema:
          type: "string"
          enum:
          - "USAGE_TYPE_UNSPECIFIED"
          - "SERVERLESS"
          - "DEDICATED_DEPLOYMENT"
          - "TRAINING"
          default: "USAGE_TYPE_UNSPECIFIED"
      - name: "timezone"
        description: "IANA timezone identifier for daily aggregation (e.g., \"America/Los_Angeles\", \"Europe/London\").\nWhen specified, the returned data will be aggregated into daily buckets based on this timezone.\nIf not specified or empty, defaults to \"UTC\".\nSee: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones"
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "groupBy"
        description: "Dimensions to group usage by (multiple values allowed; each is a separate GROUP BY column).\nServerless: \"model_name\", \"api_key_id\", \"api_key_name\", \"user_id\", \"session_id\", \"annotations.team\", \"annotations.project\", \"annotations.environment\".\nDedicated: \"deployment_name\", \"accelerator_type\", and the same annotation keys.\nTraining: \"job_id\", \"training_session_id\", \"job_type\", \"usage_type\", \"accelerator_type\", \"base_model\", and the same annotation keys.\nWhen usage_type is unspecified, dimensions that apply only to one stream are ignored on the others\n(e.g. \"deployment_name\" is ignored for serverless and training; \"model_name\" / \"api_key_id\" / \"api_key_name\" / \"user_id\" / \"session_id\"\nare ignored for dedicated and training; \"job_id\" / \"training_session_id\" / \"job_type\" are ignored for serverless and dedicated).\n\"session_id\" is the opaque client session from billing properties (serverless-only, high cardinality):\nprefer filtering by a single session; grouping by it can fan out to one row per session.\nExample: [\"annotations.team\", \"model_name\"] or [\"user_id\", \"model_name\"] or [\"api_key_id\", \"api_key_name\"].\nIf empty: serverless aggregates by model name; dedicated defaults to deployment and accelerator type;\ntraining aggregates by job_id, training_session_id, job_type, usage_type, accelerator_type and base_model."
        in: "query"
        required: false
        explode: true
        schema:
          type: "array"
          items:
            type: "string"
      - name: "filter"
        description: "This is a request variable of the map type. The query format is \"map_name[key]=value\", e.g. If the map name is Age, the key type is string, and the value type is integer, the query parameter is expressed as Age[\"bob\"]=18"
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "account_id"
        in: "path"
        required: true
        description: "The Account Id"
        schema:
          type: "string"
      tags:
      - "Gateway"
  /v1/accounts/{account_id}/datasets:
    get:
      summary: "List Datasets"
      operationId: "Gateway_ListDatasets"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gatewayListDatasetsResponse"
      parameters:
      - name: "pageSize"
        description: "The maximum number of datasets to return. The maximum page_size is 200,\nvalues above 200 will be coerced to 200.\nIf unspecified, the default is 50."
        in: "query"
        required: false
        schema:
          type: "integer"
          format: "int32"
      - name: "pageToken"
        description: "A page token, received from a previous ListDatasets call. Provide this\nto retrieve the subsequent page. When paginating, all other parameters\nprovided to ListDatasets must match the call that provided the page\ntoken."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "filter"
        description: "Only model satisfying the provided filter (if specified) will be\nreturned. See https://google.aip.dev/160 for the filter grammar."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "orderBy"
        description: "A comma-separated list of fields to order by. e.g. \"foo,bar\"\nThe default sort order is ascending. To specify a descending order for a\nfield, append a \" desc\" suffix. e.g. \"foo desc,bar\"\nSubfields are specified with a \".\" character. e.g. \"foo.bar\"\nIf not specified, the default order is by \"name\"."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "readMask"
        description: "The fields to be returned in the response. If empty or \"*\", all fields will be returned."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "account_id"
        in: "path"
        required: true
        description: "The Account Id"
        schema:
          type: "string"
      tags:
      - "Gateway"
    post:
      summary: "Create Dataset"
      operationId: "Gateway_CreateDataset"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gatewayDataset"
      parameters:
      - name: "account_id"
        in: "path"
        required: true
        description: "The Account Id"
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/gatewayGatewayCreateDatasetBody"
        required: true
      tags:
      - "Gateway"
  /v1/accounts/{account_id}/datasets/{dataset_id}:
    get:
      summary: "Get Dataset"
      operationId: "Gateway_GetDataset"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gatewayDataset"
      parameters:
      - name: "readMask"
        description: "The fields to be returned in the response. If empty or \"*\", all fields will be returned."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "account_id"
        in: "path"
        required: true
        description: "The Account Id"
        schema:
          type: "string"
      - name: "dataset_id"
        in: "path"
        required: true
        description: "The Dataset Id"
        schema:
          type: "string"
      tags:
      - "Gateway"
    patch:
      summary: "Update Dataset"
      operationId: "Gateway_UpdateDataset"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gatewayDataset"
      parameters:
      - name: "account_id"
        in: "path"
        required: true
        description: "The Account Id"
        schema:
          type: "string"
      - name: "dataset_id"
        in: "path"
        required: true
        description: "The Dataset Id"
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                displayName:
                  type: "string"
                createTime:
                  type: "string"
                  format: "date-time"
                  readOnly: true
                state:
                  $ref: "#/components/schemas/gatewayDatasetState"
                  readOnly: true
                status:
                  $ref: "#/components/schemas/gatewayStatus"
                  readOnly: true
                exampleCount:
                  type: "string"
                  format: "int64"
                userUploaded:
                  $ref: "#/components/schemas/gatewayUserUploaded"
                evaluationResult:
                  $ref: "#/components/schemas/gatewayEvaluationResult"
                transformed:
                  $ref: "#/components/schemas/gatewayTransformed"
                splitted:
                  $ref: "#/components/schemas/gatewaySplitted"
                evalProtocol:
                  $ref: "#/components/schemas/gatewayEvalProtocol"
                externalUrl:
                  type: "string"
                  title: "The external URI of the dataset. e.g. gs://foo/bar/baz.jsonl"
                format:
                  $ref: "#/components/schemas/DatasetFormat"
                createdBy:
                  type: "string"
                  description: "The email address of the user who initiated this fine-tuning job."
                  readOnly: true
                updateTime:
                  type: "string"
                  format: "date-time"
                  description: "The update time for the dataset."
                  readOnly: true
                sourceJobName:
                  type: "string"
                  description: "The resource name of the job that created this dataset (e.g., batch inference job).\nUsed for lineage tracking to understand dataset provenance."
                estimatedTokenCount:
                  type: "string"
                  format: "int64"
                  description: "The estimated number of tokens in the dataset."
                  readOnly: true
                averageTurnCount:
                  type: "number"
                  format: "float"
                  description: "An estimate of the average number of turns per sample in the dataset."
                  readOnly: true
                encryptionState:
                  $ref: "#/components/schemas/gatewayEncryptionState"
                  description: "CMEK encryption state (authoritative, immutable, stamped at creation)."
                  readOnly: true
              title: "The properties of the Dataset being updated. `dataset.name` must\nbe populated with the updated resource's name."
        description: "The properties of the Dataset being updated. `dataset.name` must\nbe populated with the updated resource's name."
        required: true
      tags:
      - "Gateway"
    delete:
      summary: "Delete Dataset"
      operationId: "Gateway_DeleteDataset"
      responses:
        200:
          description: "A successful response."
          content:
