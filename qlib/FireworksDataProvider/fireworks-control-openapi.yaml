        evalAutoCarveout:
          type: "boolean"
          description: "Whether to auto-carve the dataset for eval."
        updateTime:
          type: "string"
          format: "date-time"
          description: "The update time for the supervised fine-tuning job."
          readOnly: true
        nodes:
          type: "integer"
          format: "int32"
          description: "Deprecated: multi-node scheduling is now handled by the cookbook\norchestrator in V2 workflows. This field is ignored for V2 jobs and\nwill be removed in a future release."
        batchSize:
          type: "integer"
          format: "int32"
          description: "Deprecated: legacy V1 token budget. Training V2 batches by samples via\nbatch_size_samples."
        mtpEnabled:
          type: "boolean"
          description: "Deprecated: MTP is no longer supported by managed training. This field is\nretained for API wire compatibility only."
        mtpNumDraftTokens:
