    gatewayReinforcementFineTuningJob:
      type: "object"
      properties:
        name:
          type: "string"
          readOnly: true
        displayName:
          type: "string"
        createTime:
          type: "string"
          format: "date-time"
          readOnly: true
        completedTime:
          type: "string"
          format: "date-time"
          description: "The completed time for the reinforcement fine-tuning job."
          readOnly: true
        dataset:
          type: "string"
          description: "The name of the dataset used for training."
        evaluationDataset:
          type: "string"
          description: "The name of a separate dataset to use for evaluation."
        evalAutoCarveout:
          type: "boolean"
          description: "Whether to auto-carve the dataset for eval."
        state:
          $ref: "#/components/schemas/gatewayJobState"
          readOnly: true
        status:
          $ref: "#/components/schemas/gatewayStatus"
          readOnly: true
        createdBy:
          type: "string"
          description: "The email address of the user who initiated this fine-tuning job."
          readOnly: true
        trainingConfig:
          $ref: "#/components/schemas/gatewayBaseTrainingConfig"
          description: "Common training configurations."
        evaluator:
          type: "string"
          description: "The evaluator resource name to use for RLOR fine-tuning job."
        wandbConfig:
          $ref: "#/components/schemas/gatewayWandbConfig"
          description: "The Weights & Biases team/user account for logging training progress."
        awsS3Config:
          $ref: "#/components/schemas/gatewayAwsS3Config"
          description: "The AWS configuration for S3 dataset access."
        azureBlobStorageConfig:
          $ref: "#/components/schemas/gatewayAzureBlobStorageConfig"
          description: "The Azure configuration for Blob Storage dataset access."
        outputStats:
          type: "string"
          description: "The output dataset's aggregated stats for the evaluation job."
          readOnly: true
        jobProgress:
          $ref: "#/components/schemas/gatewayJobProgress"
          description: "Job progress."
          readOnly: true
        inferenceParameters:
          $ref: "#/components/schemas/gatewayReinforcementFineTuningJobInferenceParameters"
          description: "RFT inference parameters."
        chunkSize:
          type: "integer"
          format: "int32"
          description: "Data chunking for rollout, default size 200, enabled when dataset > 300. Valid range is 1-10,000."
        outputMetrics:
          type: "string"
          readOnly: true
        maxInferenceReplicaCount:
          type: "integer"
          format: "int32"
          title: "Maximum number of replicas to use for the deployment.\nDefault is 1"
        nodeCount:
          type: "integer"
          format: "int32"
          description: "The number of nodes to use for the fine-tuning job.\nIf not specified, the default is 1."
        lossConfig:
          $ref: "#/components/schemas/gatewayReinforcementLearningLossConfig"
          description: "Reinforcement learning loss method + hyperparameters for the underlying trainers."
        trainerLogsSignedUrl:
          type: "string"
          description: "The signed URL for the trainer logs file (stdout/stderr).\nOnly populated if the account has trainer log reading enabled."
          readOnly: true
        acceleratorSeconds:
          type: "object"
          additionalProperties:
            type: "string"
            format: "int64"
          description: "Accelerator seconds used by the job, keyed by accelerator type (e.g., \"NVIDIA_H100_80GB\"). Updated when job completes or is cancelled."
          readOnly: true
        maxConcurrentRollouts:
          type: "integer"
          format: "int32"
          description: "Maximum number of concurrent rollouts during the RFT job."
        maxConcurrentEvaluations:
          type: "integer"
          format: "int32"
          description: "Maximum number of concurrent evaluations during the RFT job."
        purpose:
          $ref: "#/components/schemas/gatewayPurpose"
          description: "Scheduling purpose for this job."
        useReservation:
          type: "boolean"
          description: "Whether to try the account's reservation capacity before falling back to shared trainer capacity."
        encryptionState:
          $ref: "#/components/schemas/gatewayEncryptionState"
          description: "CMEK encryption state (authoritative, stamped at creation)."
          readOnly: true
      required:
      - "dataset"
      - "evaluator"
    gatewayReinforcementFineTuningJobInferenceParameters:
      type: "object"
      properties:
        maxOutputTokens:
          type: "integer"
          format: "int32"
          description: "Maximum number of tokens to generate per response."
        temperature:
          type: "number"
          format: "float"
          description: "Sampling temperature, typically between 0 and 2."
        topP:
          type: "number"
          format: "float"
          description: "Top-p sampling parameter, typically between 0 and 1."
        responseCandidatesCount:
          type: "integer"
          format: "int32"
          title: "Number of response candidates to generate per input. RFT requires at least 2 candidates"
        extraBody:
          type: "string"
          description: "Additional parameters for the inference request as a JSON string.\nFor example: \"{\\\"stop\\\": [\\\"\\\\n\\\"]}\"."
        topK:
          type: "integer"
          format: "int32"
          description: "Top-k sampling parameter, limits the token selection to the top k tokens."
      title: "RFT inference parameters"
    gatewayReinforcementLearningLossConfig:
      type: "object"
      properties:
        method:
          $ref: "#/components/schemas/ReinforcementLearningLossConfigMethod"
        klBeta:
          type: "number"
          format: "float"
          description: "KL coefficient (beta) override for GRPO-like methods.\nIf unset, the trainer default is used."
        dpo:
          $ref: "#/components/schemas/gatewayDpoConfig"
          description: "DPO-specific configuration. Intended for METHOD=DPO."
        orpo:
          $ref: "#/components/schemas/gatewayOrpoConfig"
          description: "ORPO-specific configuration. Intended for METHOD=ORPO."
      description: "Loss method + hyperparameters for reinforcement-learning-style fine-tuning (e.g. RFT / RL trainers).\nFor preference jobs (DPO API), the default loss method is GRPO when METHOD_UNSPECIFIED."
    gatewayReplicaStats:
      type: "object"
      properties:
        pendingSchedulingReplicaCount:
          type: "integer"
          format: "int32"
          description: "Number of replicas waiting to be scheduled to a node."
          readOnly: true
        downloadingModelReplicaCount:
          type: "integer"
          format: "int32"
          description: "Number of replicas downloading model weights."
          readOnly: true
        initializingReplicaCount:
          type: "integer"
          format: "int32"
          description: "Number of replicas initializing the model server."
          readOnly: true
        readyReplicaCount:
          type: "integer"
          format: "int32"
          description: "Number of replicas that are ready and serving traffic."
          readOnly: true
        revocableReplicaCount:
          type: "integer"
          format: "int32"
          title: "The number of replicas that can be revoked"
          readOnly: true
        effectiveReplicaCount:
          type: "number"
          format: "float"
          description: "The effective number of replicas currently serving traffic, including\nfractional progress toward a replica that is not yet fully ready. Equals\nready_replica_count when no replica is partially ready."
          readOnly: true
    gatewayRolloutStrategy:
      type: "string"
      enum:
      - "ROLLOUT_STRATEGY_UNSPECIFIED"
      - "ROLLOUT_STRATEGY_STANDARD"
      - "ROLLOUT_STRATEGY_HOT_RELOAD"
      default: "ROLLOUT_STRATEGY_UNSPECIFIED"
      description: "The rollout strategy to use when deploying the model version.\n\n - ROLLOUT_STRATEGY_STANDARD: Standard rollout strategy updates the deployment using a normal k8s rolling restart\n - ROLLOUT_STRATEGY_HOT_RELOAD: Hot reload rollout strategy updates the deployment by hot reloading the model version on the existing replicas of the deployment"
    gatewayRouter:
      type: "object"
      properties:
        name:
          type: "string"
          readOnly: true
        displayName:
          type: "string"
        createTime:
          type: "string"
          format: "date-time"
          readOnly: true
        createdBy:
          type: "string"
          readOnly: true
        state:
          $ref: "#/components/schemas/gatewayRouterState"
          description: "The state of the router."
          readOnly: true
        status:
          $ref: "#/components/schemas/gatewayStatus"
          readOnly: true
        deployments:
          type: "array"
          items:
            type: "string"
          description: "The deployment names to be covered by the router."
        model:
          type: "string"
          description: "The model name to route requests to.\nmodel is only applicable to single-region deployments.\nFor multi-region deployments, model must be empty."
        weightedRandom:
          $ref: "#/components/schemas/gatewayWeightedRandomStrategy"
        evenLoad:
          $ref: "#/components/schemas/gatewayEvenLoadStrategy"
        aliases:
          type: "array"
          items:
            type: "string"
          title: "Aliases for the router. These are the alias names that can be used to\nroute requests through the router.\nBy default, these aliases are generated by the system.\nExamples:\n  \"accounts/foo/deployments/my-deployment\" or \"foo/my-deployment\"\n  \"accounts/foo/routers/my-router\"\n  \"accounts/foo/models/my-base-model\" - only if this is the first deployment using this model"
          readOnly: true
        autoGenerated:
          type: "boolean"
          description: "auto_generated indicates this router was generated by the system for a deployment.\nAuto-generated routers cannot be updated or deleted by the user."
          readOnly: true
        public:
          type: "boolean"
          description: "True if the router is public (any account can query the underlying workload), false if the router is private\n(only the account that owns the router can query the underlying workload)."
    gatewayRouterState:
      type: "string"
      enum:
      - "STATE_UNSPECIFIED"
      - "CREATING"
      - "READY"
      - "UPDATING"
      - "DELETING"
      default: "STATE_UNSPECIFIED"
      description: "- CREATING: The router is being created.\n - READY: The router is ready for access.\n - UPDATING: There are in-progress updates happening with the router.\n - DELETING: The router is being deleted."
    gatewaySKUInfo:
      type: "object"
      properties:
        sku:
          type: "string"
        amount:
          $ref: "#/components/schemas/typeMoney"
        unit:
          type: "string"
          title: "e.g.\n1M tokens, hour"
    gatewayScalingSchedule:
      type: "object"
      properties:
        minReplicaCount:
          type: "integer"
          format: "int32"
          description: "Minimum number of replicas guaranteed when this schedule is active.\nWhen multiple schedules overlap, the effective minimum is the highest\nmin_replica_count across all active schedules (\"max wins\").\nMust be >= 0 and <= the deployment's max_replica_count."
        schedule:
          type: "string"
          description: "Cron expression defining when this schedule's window starts.\nStandard 5-field cron format: minute hour day-of-month month day-of-week.\nExamples: \"0 8 * * Mon-Fri\" (8am weekdays), \"0 0 1 * *\" (midnight on 1st of month)."
        duration:
          type: "string"
          description: "Duration that the schedule remains active after the cron trigger.\nMust be between 300 seconds (5 minutes) and 604,800 seconds (7 days),\nand use whole-second precision. Schedules needing longer windows should\nraise the deployment's base min_replica_count instead.\nExample: \"36000s\" = 10 hours (e.g., 8am to 6pm)."
        timezone:
          type: "string"
          description: "IANA timezone for the cron expression. e.g., \"America/New_York\", \"Europe/London\", \"UTC\".\nRequired because cron expressions without a timezone are ambiguous.\nDST transitions are handled automatically."
        description:
          type: "string"
          description: "Human-readable description of the schedule.\ne.g., \"Weekday business hours\", \"Wednesday peak load\"."
        disabled:
          type: "boolean"
          description: "If true, this schedule is temporarily disabled without being deleted.\nUseful for holidays or temporary schedule changes."
      title: "A time-based scaling schedule that sets a minimum replica floor during a recurring window.\nFollows the GCP MIG scaling schedule pattern: cron start time + duration."
      required:
      - "minReplicaCount"
      - "schedule"
      - "duration"
      - "timezone"
    gatewayServerlessMode:
      type: "object"
      properties:
        name:
          type: "string"
          description: "The resource name, e.g.\naccounts/fireworks/models/kimi-k2p6/serverlessModes/fast.\n{AccountId} must be a serverless account (fireworks, ...);\n{ModelId} is the base model's id; {ServerlessModeId} is the mode name\n(default | priority | fast | spot)."
          readOnly: true
        usageIdentifier:
          type: "string"
          description: "Invocation recipe: the value to pass as \"model\" in inference requests.\nEmpty means use the base model id. May reference a DIFFERENT resource\nthan the base model — a model OR a router, e.g.\naccounts/fireworks/routers/kimi-k2p6-fast for fast."
        serviceTier:
          type: "string"
          description: "Invocation recipe: the service_tier request-body flag layered on top of the\nmodel id (e.g. \"priority\"). Only the priority mode sets this today."
        skuInfos:
          type: "array"
          items:
            type: "object"
            $ref: "#/components/schemas/gatewaySKUInfo"
          description: "Per-path token pricing, sourced live from Orb on the read path. Reuses the\nsame SKUInfo type as Model.sku_infos (e.g. \"LLM input tokens (uncached)\",\n\"LLM input tokens (cached)\", \"LLM output tokens\"; google.type.Money at\nunit=\"1M tokens\"). Resolved per tier (DEFAULT/PRIORITY/FAST/...). Empty on\nthe stored config; only populated by ListServerlessModels.\n\n(api_only) keeps this derived field out of the database entirely (like\nModel.sku_infos): it is never persisted by the admin write path and never\nread back from storage, only computed live at read time."
          readOnly: true
        useCases:
          type: "array"
          items:
            type: "string"
          description: "Curated use-case tags driving discovery filters (e.g. \"coding\")."
        updatedBy:
          type: "string"
          description: "The user who last mutated this mode (audit)."
          readOnly: true
        createTime:
          type: "string"
          format: "date-time"
          readOnly: true
        updateTime:
          type: "string"
          format: "date-time"
          readOnly: true
      description: "ServerlessMode is one way a serverless base model can be invoked — standard\nserverless (default), Priority, Fast, or Spot — together with the invocation\nrecipe customers must use for it.\n\nIt is a child resource of the base Model: the {ServerlessModeId} segment of\nthe resource name IS the mode name (default | priority | fast | spot). The\nbase model is the linking key for all of its serving modes, even when a mode\nis served through a different resource (a Fast router, a Spot deployment).\n\nModes split into two classes:\n  - Alternate-resource modes (usage_identifier set) — e.g. fast resolves to a\n    router, spot to the spot deployment's own model id.\n  - Flag modes (service_tier set) — e.g. priority uses the base model id plus\n    a request-body service_tier flag.\n\nPricing is sourced live from Orb (keyed by the resolved model name / tier),\nso no price is stored on the mode."
    gatewaySplitDatasetResponse:
      type: "object"
      properties:
        chunkDatasetNames:
          type: "array"
          items:
            type: "string"
          title: "The resource names of the created chunk datasets"
        chunksCreated:
          type: "integer"
          format: "int32"
          title: "The number of chunks created"
        totalExamples:
          type: "string"
          format: "int64"
          title: "The total number of examples processed"
      title: "Response message for dataset splitting"
    gatewaySplitted:
      type: "object"
      properties:
        sourceDatasetId:
          type: "string"
      required:
      - "sourceDatasetId"
    gatewayStatus:
      type: "object"
      properties:
        code:
          $ref: "#/components/schemas/gatewayCode"
          description: "The status code."
        message:
          type: "string"
          description: "A developer-facing error message in English."
      title: "Mimics [https://github.com/googleapis/googleapis/blob/master/google/rpc/status.proto]"
    gatewaySupervisedFineTuningJob:
      type: "object"
