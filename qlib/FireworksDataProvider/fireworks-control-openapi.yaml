          type: "string"
        totalSize:
          type: "integer"
          format: "int32"
    gatewayListTrainingShapesResponse:
      type: "object"
      properties:
        trainingShapes:
          type: "array"
          items:
            type: "object"
            $ref: "#/components/schemas/gatewayTrainingShape"
        nextPageToken:
          type: "string"
        totalSize:
          type: "integer"
          format: "int32"
    gatewayListUserUsageLimitsResponse:
      type: "object"
      properties:
        userUsageLimits:
          type: "array"
          items:
            type: "object"
            $ref: "#/components/schemas/gatewayUserUsageLimits"
          description: "One entry per user in the account (zero usage for users that incurred none\nthis period), ordered by user id."
        nextPageToken:
          type: "string"
          description: "A token to pass as page_token to retrieve the next page. Empty when there\nare no further pages."
    gatewayModel:
      type: "object"
      properties:
        name:
          type: "string"
          title: "The resource name of the model. e.g. accounts/my-account/models/my-model"
          readOnly: true
        displayName:
          type: "string"
          description: "Human-readable display name of the model. e.g. \"My Model\"\nMust be fewer than 64 characters long."
        description:
          type: "string"
          description: "The description of the model. Must be fewer than 1000 characters long."
        createTime:
          type: "string"
          format: "date-time"
          description: "The creation time of the model."
          readOnly: true
        state:
          $ref: "#/components/schemas/gatewayModelState"
          description: "The state of the model."
          readOnly: true
        status:
          $ref: "#/components/schemas/gatewayStatus"
          description: "Contains detailed message when the last model operation fails."
          readOnly: true
        kind:
          $ref: "#/components/schemas/ModelKind"
          description: "The kind of model.\nIf not specified, the default is HF_PEFT_ADDON."
        githubUrl:
          type: "string"
          description: "The URL to GitHub repository of the model."
        huggingFaceUrl:
          type: "string"
          description: "The URL to the Hugging Face model."
        baseModelDetails:
          $ref: "#/components/schemas/gatewayBaseModelDetails"
          description: "Base model details.\nRequired if kind is HF_BASE_MODEL. Must not be set otherwise."
        peftDetails:
          $ref: "#/components/schemas/gatewayPEFTDetails"
          description: "PEFT addon details.\nRequired if kind is HF_PEFT_ADDON or HF_TEFT_ADDON."
        teftDetails:
          $ref: "#/components/schemas/gatewayTEFTDetails"
          description: "TEFT addon details.\nRequired if kind is HF_TEFT_ADDON. Must not be set otherwise."
        public:
          type: "boolean"
          description: "If true, the model will be publicly readable."
        conversationConfig:
          $ref: "#/components/schemas/gatewayConversationConfig"
          description: "If set, the Chat Completions API will be enabled for this model."
        contextLength:
          type: "integer"
          format: "int32"
          description: "The maximum context length supported by the model."
        supportsImageInput:
          type: "boolean"
          description: "If set, images can be provided as input to the model."
        supportsTools:
          type: "boolean"
          description: "If set, tools (i.e. functions) can be provided as input to the model,\nand the model may respond with one or more tool calls."
        importedFrom:
          type: "string"
          description: "The name of the the model from which this was imported. This field is empty\nif the model was not imported."
          readOnly: true
        fineTuningJob:
          type: "string"
          description: "If the model was created from a fine-tuning job, this is the fine-tuning\njob name."
          readOnly: true
        defaultDraftModel:
          type: "string"
          description: "The default draft model to use when creating a deployment. If empty,\nspeculative decoding is disabled by default."
        defaultDraftTokenCount:
          type: "integer"
          format: "int32"
          description: "The default draft token count to use when creating a deployment.\nMust be specified if default_draft_model is specified."
        deployedModelRefs:
          type: "array"
          items:
            type: "object"
            $ref: "#/components/schemas/gatewayDeployedModelRef"
          description: "Populated from GetModel API call only."
          readOnly: true
        cluster:
          type: "string"
          description: "The resource name of the BYOC cluster to which this model belongs.\ne.g. accounts/my-account/clusters/my-cluster. Empty if it belongs to\na Fireworks cluster."
          readOnly: true
        deprecationDate:
          $ref: "#/components/schemas/typeDate"
          description: "If specified, this is the date when the serverless deployment of the model will be taken down."
        calibrated:
          type: "boolean"
          description: "If true, the model is calibrated and can be deployed to non-FP16 precisions."
          readOnly: true
        tunable:
          type: "boolean"
          description: "Deprecated: V1 training stack only — LoRA only, limited architecture support.\nIf the model has use_training_v2=true, use supervised_lora_tunable and\nsupervised_full_parameter_tunable instead."
          readOnly: true
        supportsLora:
          type: "boolean"
          description: "Whether this model supports LoRA."
        useHfApplyChatTemplate:
          type: "boolean"
          description: "If true, the model will use the Hugging Face apply_chat_template API to apply the chat template."
        updateTime:
          type: "string"
          format: "date-time"
          description: "The update time for the model."
          readOnly: true
        defaultSamplingParams:
          type: "object"
          additionalProperties:
            type: "number"
            format: "float"
          description: "A json object that contains the default sampling parameters for the model."
          readOnly: true
        rlTunable:
          type: "boolean"
          description: "Deprecated: V1 training stack only — LoRA only, limited architecture support.\nIf the model has use_training_v2=true, use rl_lora_tunable and\nrl_full_parameter_tunable instead."
          readOnly: true
        trainingContextLength:
          type: "integer"
          format: "int32"
          description: "The maximum context length supported by the model."
        snapshotType:
          $ref: "#/components/schemas/ModelSnapshotType"
        supportsServerless:
          type: "boolean"
          description: "If true, the model has a serverless deployment."
          readOnly: true
        useTrainingV2:
          type: "boolean"
          description: "If true, SFT jobs for this base model use service-mode (StatefulSet +\norchestration sidecar) instead of the legacy batch Job path."
        supervisedLoraTunable:
          type: "boolean"
          description: "V2 only. Whether the model supports LoRA supervised fine-tuning and DPO (lora_rank > 0).\nTrue when a validated LORA_TRAINER training shape exists."
          readOnly: true
        supervisedFullParameterTunable:
          type: "boolean"
          description: "V2 only. Whether the model supports full-parameter supervised fine-tuning and DPO (lora_rank = 0).\nTrue when a validated POLICY_TRAINER training shape exists."
          readOnly: true
        rlLoraTunable:
          type: "boolean"
          description: "V2 only. Whether the model supports LoRA reinforcement learning (lora_rank > 0).\nTrue when a validated LORA_TRAINER training shape exists plus a deployment shape."
          readOnly: true
        rlFullParameterTunable:
          type: "boolean"
          description: "V2 only. Whether the model supports full-parameter reinforcement learning (lora_rank = 0).\nTrue when validated POLICY_TRAINER + LORA_TRAINER training shapes exist plus a deployment shape."
          readOnly: true
        encryptionState:
          $ref: "#/components/schemas/gatewayEncryptionState"
          description: "CMEK encryption state (authoritative, stamped at creation)."
          readOnly: true
        serverlessModes:
          type: "array"
          items:
            type: "object"
            $ref: "#/components/schemas/gatewayServerlessMode"
          description: "The serverless modes this base model is available on — the serverless read\nshape. Populated on read (e.g. the serverless catalog read path); one entry\nper serving mode. Empty for non-serverless models."
          readOnly: true
    gatewayModelState:
      type: "string"
      enum:
      - "STATE_UNSPECIFIED"
      - "UPLOADING"
      - "READY"
      default: "STATE_UNSPECIFIED"
      description: "- UPLOADING: The model is still being uploaded (upload is asynchronous).\n - READY: The model is ready to be used."
    gatewayModelVersion:
      type: "object"
      properties:
        name:
          type: "string"
          description: "The resource name of the deployment snapshot."
          readOnly: true
        createTime:
          type: "string"
          format: "date-time"
          readOnly: true
        snapshot:
          $ref: "#/components/schemas/gatewayModel"
          readOnly: true
    gatewayMultiRegion:
      type: "string"
      enum:
      - "MULTI_REGION_UNSPECIFIED"
      - "GLOBAL"
      - "US"
      - "EUROPE"
      - "APAC"
      default: "MULTI_REGION_UNSPECIFIED"
    gatewayNotificationSettings:
      type: "object"
      properties:
        monthlySpendThresholds:
          type: "array"
          items:
            type: "object"
            $ref: "#/components/schemas/typeMoney"
          description: "Spend thresholds at which to send monthly usage warning emails.\nThese should be below the account's monthly spend quota.\nExample: [{currency_code: \"USD\", units: 500}, {currency_code: \"USD\", units: 800}]\n  would alert at $500 and $800.\nNote: An alert at 80% of the monthly spend limit is always added\nin addition to the thresholds specified in this list."
      description: "NotificationSettings configures notification preferences for an account.\n(accounts/{account}/notificationSettings) when more notification categories\nare added. Requires adding singleton support to the resource generator."
    gatewayOrpoConfig:
      type: "object"
      properties:
        lambda:
          type: "number"
          format: "float"
          description: "Weight for the ORPO odds-ratio loss term."
      description: "Hyperparameters for Odds Ratio Preference Optimization (ORPO) training."
    gatewayPEFTDetails:
      type: "object"
      properties:
        baseModel:
          type: "string"
          title: "The base model name. e.g. accounts/fireworks/models/falcon-7b"
        r:
          type: "integer"
          format: "int32"
          description: "The rank of the update matrices.\nMust be between 4 and 64, inclusive."
        targetModules:
          type: "array"
          items:
            type: "string"
          title: "This is the target modules for an adapter that we extract from\nfor more information what target module means, check out\nhttps://huggingface.co/docs/peft/conceptual_guides/lora#common-lora-parameters-in-peft"
        baseModelType:
          type: "string"
          description: "The type of the model."
          readOnly: true
        mergeAddonModelName:
          type: "string"
          title: "The resource name of the model to merge with base model, e.g accounts/fireworks/models/falcon-7b-lora"
      title: "PEFT addon details."
      required:
      - "baseModel"
      - "r"
      - "targetModules"
    gatewayPlacement:
      type: "object"
      properties:
        region:
          $ref: "#/components/schemas/gatewayRegion"
          description: "The region where the deployment must be placed."
        multiRegion:
          $ref: "#/components/schemas/gatewayMultiRegion"
          description: "The multi-region where the deployment must be placed."
        regions:
          type: "array"
          items:
            $ref: "#/components/schemas/gatewayRegion"
          title: "The list of regions where the deployment must be placed"
      description: "The desired geographic region where the deployment must be placed. Exactly one field will be\nspecified."
    gatewayPreviewEvaluationResponse:
      type: "object"
      properties:
        results:
          type: "array"
          items:
            type: "object"
            $ref: "#/components/schemas/gatewayPreviewEvaluationResult"
          title: "Results for each sample"
        totalSamples:
          type: "integer"
          format: "int32"
          title: "Summary statistics"
        totalRuntimeMs:
          type: "string"
          format: "int64"
          title: "overalll runtime"
      title: "Response for preview evaluation"
    gatewayPreviewEvaluationResult:
      type: "object"
      properties:
        success:
          type: "boolean"
          title: "The input sample"
        reason:
          type: "string"
          title: "Output from the evaluation run"
        score:
          type: "number"
          format: "double"
          description: "Score (if applicable)\nDeprecated: Use metrics field instead."
        messages:
          type: "array"
          items:
            type: "object"
          title: "messages, which can be any kind of object"
        metrics:
          type: "object"
          additionalProperties:
            type: "number"
            format: "double"
          title: "Metrics from the evaluation run"
      title: "A single evaluation result from a preview"
    gatewayPreviewEvaluatorResponse:
      type: "object"
      properties:
        results:
          type: "array"
          items:
            type: "object"
            $ref: "#/components/schemas/gatewayPreviewEvaluatorSampleResult"
        totalSamples:
          type: "integer"
          format: "int32"
        totalRuntimeMs:
          type: "string"
          format: "int64"
        stdout:
          type: "array"
          items:
            type: "string"
        stderr:
          type: "array"
          items:
            type: "string"
    gatewayPreviewEvaluatorSampleResult:
      type: "object"
      properties:
        success:
          type: "string"
          title: "Overall eval success (true) or failure (false) on the sample, empty string means success not defined"
        score:
          type: "number"
          format: "double"
          title: "Score (rollup score if applicable)"
        perMetricEvals:
          type: "object"
          additionalProperties:
            type: "object"
          title: "Per metric eval results"
        reason:
          type: "string"
          title: "reason for the eval result"
    gatewayPricingPlan:
      type: "object"
      properties:
        name:
          type: "string"
          title: "The resource name of the pricing plan\nFormat: accounts/{account}/pricingPlans/{pricing_plan_id}"
          readOnly: true
        billingType:
          $ref: "#/components/schemas/PricingPlanBillingType"
          title: "Billing type determines how usage is tracked and billed"
        tokenConfig:
          type: "array"
          items:
            type: "object"
            $ref: "#/components/schemas/PricingPlanTokenBillingConfig"
          title: "Configuration for token-based billing"
        acceleratorHourConfig:
          type: "array"
          items:
            type: "object"
            $ref: "#/components/schemas/PricingPlanAcceleratorHourBillingConfig"
          title: "Configuration for accelerator-hour billing"
        startTime:
          type: "string"
          format: "date-time"
          title: "When this pricing plan becomes active"
        endTime:
          type: "string"
          format: "date-time"
          title: "When this pricing plan expires"
        createTime:
          type: "string"
          format: "date-time"
          title: "Creation timestamp"
          readOnly: true
        updateTime:
          type: "string"
          format: "date-time"
          title: "Last update timestamp"
          readOnly: true
        state:
          $ref: "#/components/schemas/gatewayPricingPlanState"
          title: "The state of the pricing plan"
          readOnly: true
      description: "PricingPlan defines a custom billing plan for an account\nEach PricingPlan is associated with a contract, and describes the pricing terms for a specific service."
      required:
      - "billingType"
      - "startTime"
    gatewayPricingPlanState:
      type: "string"
      enum:
      - "STATE_UNSPECIFIED"
      - "CREATING"
      - "READY"
      default: "STATE_UNSPECIFIED"
    gatewayProvider:
      type: "object"
      properties:
        id:
          type: "string"
          title: "Provider ID (e.g., \"openai:gpt-4\")"
        config:
          type: "object"
          additionalProperties:
            type: "string"
          title: "Optional provider-specific configuration"
        label:
          type: "string"
          title: "Optional label for the provider"
      title: "Represents an LLM provider"
    gatewayPurpose:
      type: "string"
      enum:
      - "PURPOSE_UNSPECIFIED"
      - "PURPOSE_PILOT"
      default: "PURPOSE_UNSPECIFIED"
      description: "Scheduling purpose for training jobs and deployments."
    gatewayQuota:
