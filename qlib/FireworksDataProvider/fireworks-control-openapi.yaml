        schema:
          type: "string"
      tags:
      - "Gateway"
  /v1/accounts/{account_id}/usageLimits:
    get:
      summary: "Returns the account-level usage-limits singleton (default per-user cap,\nenforcement, account-wide usage rollup)."
      operationId: "Gateway_GetAccountUsageLimits"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gatewayAccountUsageLimits"
      parameters:
      - name: "account_id"
        in: "path"
        required: true
        description: "The Account Id"
        schema:
          type: "string"
      tags:
      - "Gateway"
    patch:
      summary: "Updates the account-level usage-limits singleton (default per-user cap,\nenforcement)."
      operationId: "Gateway_UpdateAccountUsageLimits"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gatewayAccountUsageLimits"
      parameters:
      - name: "account_id"
        in: "path"
        required: true
        description: "The Account Id"
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                defaultUserLimit:
                  $ref: "#/components/schemas/typeMoney"
                  description: "The default per-user cap applied to every user without an override. Unset\nmeans no default cap (users are unlimited unless individually capped)."
                enforcementMode:
                  $ref: "#/components/schemas/gatewayAccountUsageLimitsEnforcementMode"
                  description: "Enforcement mode applied to the per-user caps in this account."
                used:
                  $ref: "#/components/schemas/typeMoney"
                  description: "Account-wide current-period usage (the sum across users). Computed at read\ntime; not stored."
                  readOnly: true
                updateTime:
                  type: "string"
                  format: "date-time"
                  description: "The time the account usage limits (default cap / enforcement mode) were\nlast updated. Unset until the account row is first written."
                  readOnly: true
              title: "The account usage limits to update. `account_usage_limits.name` must be set."
        description: "The account usage limits to update. `account_usage_limits.name` must be set."
        required: true
      tags:
      - "Gateway"
  /v1/accounts/{account_id}/userUsageLimits:
    get:
      summary: "Lists every user's usage limits in the account (the roster: usage vs.\neffective cap and over-limit status per user)."
      operationId: "Gateway_ListUserUsageLimits"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gatewayListUserUsageLimitsResponse"
      parameters:
      - name: "pageSize"
        description: "Maximum number of users to return. Coerced to a default when unset and to a\nmaximum when too large."
        in: "query"
        required: false
        schema:
          type: "integer"
          format: "int32"
      - name: "pageToken"
        description: "A page token from a previous ListUserUsageLimits call. page_size still\nbounds every page; the token only marks where the next page starts."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "account_id"
        in: "path"
        required: true
        description: "The Account Id"
        schema:
          type: "string"
      tags:
      - "Gateway"
security:
- BearerAuth: []
servers:
- url: "https://api.fireworks.ai"
components:
  securitySchemes:
    BearerAuth:
      type: "http"
      scheme: "bearer"
      description: "Bearer authentication using your Fireworks API key. Format: Bearer <API_KEY>"
      bearerFormat: "API_KEY"
  schemas:
    AccountAccountType:
      type: "string"
      enum:
      - "ACCOUNT_TYPE_UNSPECIFIED"
      - "ENTERPRISE"
      default: "ACCOUNT_TYPE_UNSPECIFIED"
    AccountRateLimitMetric:
      type: "string"
      enum:
      - "METRIC_UNSPECIFIED"
      - "TOKENS_GENERATED"
      - "TOKENS_PROMPT"
      - "TOKENS_CACHE_ADJUSTED_PROMPT"
      - "TOKENS_CACHED_PROMPT"
      - "TOKENS_UNCACHED_PROMPT"
      default: "METRIC_UNSPECIFIED"
      description: "Which rate-limit metric this row describes."
    AccountSuspendState:
      type: "string"
      enum:
      - "UNSUSPENDED"
      - "FAILED_PAYMENTS"
      - "CREDIT_DEPLETED"
      - "MONTHLY_SPEND_LIMIT_EXCEEDED"
      - "BLOCKED_BY_ABUSE_RULE"
      default: "UNSUSPENDED"
    AccountUsageDedicatedDeploymentUsage:
      type: "object"
      properties:
        deploymentId:
          type: "string"
          title: "The deployment ID"
        acceleratorType:
          type: "string"
          title: "GPU type / accelerator type"
        acceleratorSeconds:
          type: "string"
          format: "int64"
          title: "Accelerator seconds"
        startTime:
          type: "string"
          format: "date-time"
          description: "Start timestamp of the usage.\nNote: Dedicated deployment usage events are aggregated daily. Only the date portion (YYYY-MM-DD) is used;\nthe time portion is ignored."
        endTime:
          type: "string"
          format: "date-time"
          description: "End timestamp of the usage.\nNote: Dedicated deployment usage events are aggregated daily. Only the date portion (YYYY-MM-DD) is used;\nthe time portion is ignored."
        baseModel:
          type: "string"
          title: "Base model of the deployment"
        usageType:
          type: "string"
          title: "Usage type to distinguish between different deployment types"
        placement:
          type: "string"
          description: "Deployment placement as a string (e.g. US_IOWA_1, GLOBAL, US, EUROPE).\nSet to REGION_UNSPECIFIED when unknown."
        group:
          type: "object"
          additionalProperties:
            type: "string"
          description: "Group-by dimension key-values (deployment_name, accelerator_type, team, project, environment)."
      description: "One dedicated deployment usage aggregation bucket."
    AccountUsageServerlessUsage:
      type: "object"
      properties:
        modelName:
          type: "string"
          description: "Deprecated: use group[\"model_name\"] instead."
        promptTokens:
          type: "string"
          format: "int64"
          title: "Number of prompt tokens (for text inference)"
        completionTokens:
          type: "string"
          format: "int64"
          title: "Number of completion tokens (for text inference)"
        cachedPromptTokens:
          type: "string"
          format: "int64"
          description: "Number of prompt tokens served from cache (for text inference). Subset of prompt_tokens."
        uncachedPromptTokens:
          type: "string"
          format: "int64"
          description: "Number of prompt tokens not served from cache (for text inference). prompt_tokens - cached_prompt_tokens."
        startTime:
          type: "string"
          format: "date-time"
          title: "Start timestamp of the usage.\nNote: Serverless usage events are aggregated daily. Only the date portion (YYYY-MM-DD) is used;"
        endTime:
          type: "string"
          format: "date-time"
          title: "End timestamp of the usage.\nNote: Serverless usage events are aggregated daily. Only the date portion (YYYY-MM-DD) is used;"
        audioInputSeconds:
          type: "number"
          format: "double"
          title: "Audio input seconds (for audio inference)"
        usageType:
          type: "string"
          title: "Usage type to distinguish between different inference types"
        apiKeyId:
          type: "string"
          description: "Deprecated: use group[\"api_key_id\"] instead."
        group:
          type: "object"
          additionalProperties:
            type: "string"
          description: "Group-by dimension key-values (model_name, api_key_id, api_key_name, user_id, session_id, team, project, environment).\nsession_id is present only for buckets that had an opaque client session; no-session usage\nomits the key (all such usage collapses into a single \"no session\" bucket)."
        costNanoUsd:
          type: "number"
          format: "double"
          description: "Cost in nano-USD (1e-9 USD), summed from properties.cost. 0 when absent\n(not \"free\"). Only huggingface currently stamps authoritative cost."
      description: "One serverless usage aggregation bucket."
    AccountUsageTrainingUsage:
      type: "object"
      properties:
        jobId:
          type: "string"
          description: "The managed training job id (e.g. supervised_fine_tuning_job id,\nrlor_trainer_job id). Empty for serverless training token rows; use\n`training_session_id` for those.\nBest-effort: extracted from billing event_id for legacy records that did\nnot emit it as an explicit property."
        trainingSessionId:
          type: "string"
          description: "The serverless training session id. Populated for SERVERLESS_TRAINING_TOKENS\nrows and empty for managed training jobs."
        jobType:
          type: "string"
          description: "High-level training job kind: \"sft\", \"dpo\", \"rft\", \"trainer\", etc.\nBest-effort for legacy records."
        usageType:
          type: "string"
          description: "The underlying billing usage_type as emitted to the billing pipeline,\ne.g. \"SUPERVISED_FINE_TUNING_USAGE\", \"REINFORCEMENT_FINE_TUNING_GPU_SECONDS\",\n\"FULL_PARAM_FINE_TUNING_GPU_HOURS\". Frontends can use this to pick the\nright metric to display (tokens vs. accelerator_seconds)."
        tokens:
          type: "string"
          format: "int64"
          description: "Total tokens billed for this bucket. Populated for SFT / DPO usage;\n0 for accelerator-second usage types."
        acceleratorType:
          type: "string"
          description: "Accelerator type for accelerator-second usage (e.g. \"NVIDIA_H100_80GB\").\nEmpty for token-based usage."
        acceleratorSeconds:
          type: "string"
          format: "int64"
          description: "Total accelerator seconds billed for this bucket. Frontends typically\ndisplay this as GPU hours (seconds / 3600). 0 for token-based usage."
        baseModel:
          type: "string"
          description: "Base model for the training job, when known."
        startTime:
          type: "string"
          format: "date-time"
          description: "Start timestamp of the usage bucket.\nNote: Training usage events are aggregated daily. Only the date portion\n(YYYY-MM-DD) is used; the time portion is ignored."
        endTime:
          type: "string"
          format: "date-time"
          description: "End timestamp of the usage bucket.\nNote: Training usage events are aggregated daily. Only the date portion\n(YYYY-MM-DD) is used; the time portion is ignored."
        group:
          type: "object"
          additionalProperties:
            type: "string"
          description: "Group-by dimension key-values for the requested group_by. May include any\nof: job_id, training_session_id, job_type, usage_type, accelerator_type,\nbase_model, annotations.team, annotations.project, annotations.environment.\nEmpty values are omitted. Annotation values will typically be empty for\ntraining usage until billing emitters propagate annotations."
        annotations:
          type: "object"
          additionalProperties:
            type: "string"
          description: "Annotation key-values associated with this bucket (team, project,\nenvironment). Mirrors the annotation entries in `group` for API\nsymmetry with future per-stream consumers. Typically empty for\ntraining usage today until trainer-side billing emitters populate\nproperties.annotation_* on every record."
      description: "One training usage aggregation bucket.\n\nTraining usage is emitted by the trainer-side billing pipeline. SFT / DPO\nusage is metered in tokens; RFT and full-param (service-mode) trainer\nusage is metered in accelerator-seconds. Both metrics are returned on the\nsame message; consumers should use `usage_type` to disambiguate which\nmetric is meaningful for a given row.\n\nSome legacy training billing events did not populate every metadata\nfield. Missing values are returned as the proto default (empty string /\n0) rather than as an error."
    AssertionAssertionType:
      type: "string"
      enum:
      - "ASSERTION_TYPE_UNSPECIFIED"
      - "ASSERTION_TYPE_LLM"
      - "ASSERTION_TYPE_CODE"
      default: "ASSERTION_TYPE_UNSPECIFIED"
    BaseModelDetailsCheckpointFormat:
      type: "string"
      enum:
      - "CHECKPOINT_FORMAT_UNSPECIFIED"
      - "NATIVE"
      - "HUGGINGFACE"
      - "UNINITIALIZED"
      default: "CHECKPOINT_FORMAT_UNSPECIFIED"
    BatchInferenceJobLifecycleTimestamps:
      type: "object"
      properties:
        validatedTime:
          type: "string"
          format: "date-time"
          description: "When dataset validation completed and the job left VALIDATING. Unset for\njobs that skip validation or that fail before validating."
          readOnly: true
        runStartTime:
          type: "string"
          format: "date-time"
          description: "When the runner first started processing (the job first became RUNNING)."
          readOnly: true
        endTime:
          type: "string"
          format: "date-time"
          description: "The terminal time of the job (when it reached COMPLETED, FAILED, EXPIRED,\nor CANCELLED)."
          readOnly: true
      description: "Observed execution milestone timestamps for the job, grouped into one\nsub-message so the job's lifecycle reads as a single cohesive unit rather\nthan a scatter of top-level time fields. All OUTPUT_ONLY."
    CodeAssertionExecutionOptions:
      type: "object"
      properties:
        timeoutMs:
          type: "integer"
          format: "int32"
          title: "Timeout in milliseconds, max 5 minutes"
        memoryLimitMb:
          type: "integer"
          format: "int32"
          title: "Memory limit in MB, max 1GB"
        envVars:
          type: "object"
          additionalProperties:
            type: "string"
          title: "Environment variables"
      title: "Options for execution"
    DatasetFormat:
      type: "string"
      enum:
      - "FORMAT_UNSPECIFIED"
      - "CHAT"
      - "COMPLETION"
      - "RL"
      default: "FORMAT_UNSPECIFIED"
    DeploymentHotLoadBucketType:
      type: "string"
      enum:
      - "BUCKET_TYPE_UNSPECIFIED"
      - "MINIO"
      - "S3"
      - "NEBIUS"
      - "FW_HOSTED"
      default: "BUCKET_TYPE_UNSPECIFIED"
      title: "- FW_HOSTED: Fireworks hosted bucket"
    DeploymentHotLoadTransitionType:
      type: "string"
      enum:
      - "HOT_LOAD_TRANSITION_TYPE_UNSPECIFIED"
      - "ASYNC"
      - "SYNC"
      default: "HOT_LOAD_TRANSITION_TYPE_UNSPECIFIED"
    DeploymentPrecision:
      type: "string"
      enum:
      - "PRECISION_UNSPECIFIED"
      - "FP16"
      - "FP8"
      - "FP8_MM"
      - "FP8_AR"
      - "FP8_MM_KV_ATTN"
      - "FP8_KV"
      - "FP8_MM_V2"
      - "FP8_V2"
      - "FP8_MM_KV_ATTN_V2"
      - "NF4"
      - "FP4"
      - "BF16"
      - "FP4_BLOCKSCALED_MM"
      - "FP4_MX_MOE"
      default: "PRECISION_UNSPECIFIED"
      title: "- PRECISION_UNSPECIFIED: if left unspecified we will treat this as a legacy model created before\nself serve"
    DeploymentShapePresetType:
      type: "string"
      enum:
      - "PRESET_TYPE_UNSPECIFIED"
      - "MINIMAL"
      - "FAST"
      - "THROUGHPUT"
      - "FULL_PRECISION"
      - "AGENTIC_CODING"
      - "CHAT"
      - "SUMMARIZATION"
      - "MULTI_LORA"
      default: "PRESET_TYPE_UNSPECIFIED"
      title: "- MINIMAL: Preset for cheapest & most minimal type of deployment\n - FAST: Preset for fastest generation & TTFT deployment\n - THROUGHPUT: Preset for best throughput deployment\n - FULL_PRECISION: Preset for deployment with full precision for training & most accurate numerics\n - AGENTIC_CODING: Preset for autonomous code generation and analysis for development workflows\n - CHAT: Preset for interactive conversational AI for customer engagement\n - SUMMARIZATION: Preset for efficient document and content summarization\n - MULTI_LORA: Preset for multi-LORA serving (deployments that can enable LORA addons)"
    DeploymentShapeVersionCapability:
      type: "string"
      enum:
      - "CAPABILITY_UNSPECIFIED"
      - "MULTI_LORA"
      default: "CAPABILITY_UNSPECIFIED"
      description: "A capability that a deployment shape version supports."
    EvaluatorSource:
      type: "object"
      properties:
        type:
          $ref: "#/components/schemas/EvaluatorSourceType"
          description: "Identifies how the evaluator source code is provided."
        githubRepositoryName:
          type: "string"
          description: "Normalized GitHub repository name (e.g. owner/repository) when the source is GitHub."
    EvaluatorSourceType:
      type: "string"
      enum:
      - "TYPE_UNSPECIFIED"
      - "TYPE_UPLOAD"
      - "TYPE_GITHUB"
      - "TYPE_TEMPORARY"
      default: "TYPE_UNSPECIFIED"
      title: "- TYPE_UPLOAD: Source code is uploaded by the user\n - TYPE_GITHUB: Source code is from a GitHub repository\n - TYPE_TEMPORARY: Source code is a temporary UI uploaded code"
    ModelKind:
      type: "string"
      enum:
      - "KIND_UNSPECIFIED"
      - "HF_BASE_MODEL"
