          description: "Deprecated: see mtp_enabled."
        mtpFreezeBaseModel:
          type: "boolean"
          description: "Deprecated: see mtp_enabled."
        jobProgress:
          $ref: "#/components/schemas/gatewayJobProgress"
          description: "Job progress."
          readOnly: true
        metricsFileSignedUrl:
          type: "string"
          title: "The signed URL for the metrics file"
        trainerLogsSignedUrl:
          type: "string"
          description: "The signed URL for the trainer logs file (stdout/stderr).\nOnly populated if the account has trainer log reading enabled."
          readOnly: true
        renderSamplesSignedUrl:
          type: "string"
          description: "The signed URL for orchestrator-rendered token IDs and loss masks."
          readOnly: true
        gradientAccumulationSteps:
          type: "integer"
          format: "int32"
