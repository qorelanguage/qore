      - "CREATING"
      - "READY"
      - "DELETING"
      - "FAILED"
      - "UPDATING"
      default: "STATE_UNSPECIFIED"
      description: "- CREATING: The deployment shard is still being created.\n - READY: The deployment shard is ready to be used.\n - DELETING: The deployment shard is being deleted.\n - FAILED: The deployment shard failed to be created. See the `status` field for\nadditional details on why it failed.\n - UPDATING: There are in-progress updates happening with the deployment shard."
