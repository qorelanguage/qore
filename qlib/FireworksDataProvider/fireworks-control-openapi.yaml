        schema:
          type: "string"
      - name: "readMask"
        description: "The fields to be returned in the response. If empty or \"*\", all fields will be returned."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "account_id"
        in: "path"
        required: true
        description: "The Account Id"
        schema:
          type: "string"
      - name: "training_shape_id"
        in: "path"
        required: true
