          readOnly: true
        limitOverride:
          $ref: "#/components/schemas/typeMoney"
          description: "The user's override cap. Unset means inherit the account default."
        effectiveLimit:
          $ref: "#/components/schemas/typeMoney"
          description: "The user's resolved effective cap: their override, else the account\ndefault. Unset means the user has no cap (unlimited). Computed at read\ntime; not stored."
          readOnly: true
        used:
          $ref: "#/components/schemas/typeMoney"
          description: "Current-period usage. Computed at read time; not stored."
          readOnly: true
        enforcementMode:
