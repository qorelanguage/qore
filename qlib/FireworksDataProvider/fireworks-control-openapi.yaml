          readOnly: true
      description: "AccountUsageLimits is the account-level usage-limits singleton: the default\nper-user cap and enforcement mode applied to every user in the account, plus\nthe account-wide current-period usage rollup. There is exactly one per\naccount. The default cap and enforcement mode are stored; the usage rollup is\ncomputed at read time."
    gatewayAccountUsageLimitsEnforcementMode:
      type: "string"
      enum:
      - "ENFORCEMENT_MODE_UNSPECIFIED"
      - "DISABLED"
      - "WARN"
      - "BLOCK"
      default: "ENFORCEMENT_MODE_UNSPECIFIED"
      description: "EnforcementMode controls what happens when a user reaches their limit.\n\n - DISABLED: No tracking, no notifications, no enforcement.\n - WARN: Usage is tracked but never blocked. A safe stage before BLOCK.\n - BLOCK: Usage is tracked and the user is blocked at their limit until the period\nresets."
