          description: "Human-readable display name of the training shape. e.g. \"Llama3 70B H200 BF16\"\nMust be fewer than 64 characters long."
        description:
          type: "string"
          description: "The description of the training shape. Must be fewer than 1000 characters long."
        createTime:
          type: "string"
          format: "date-time"
          description: "The creation time of the training shape."
          readOnly: true
        updateTime:
          type: "string"
          format: "date-time"
          description: "The update time for the training shape."
          readOnly: true
        baseModel:
          type: "string"
          title: "The base model name. e.g. accounts/fireworks/models/llama-3-70b"
        deploymentShapeVersion:
