      description: "Retrieves an evaluator by name. Use this to monitor build progress after\ncreation (**step 6** in the [Create Evaluator](/api-reference/create-evaluator) workflow).\n\nPossible states:\n\n- `BUILDING` - Environment is being prepared\n- `ACTIVE` - Evaluator is ready to use\n- `BUILD_FAILED` - Check build logs via [Get Evaluator Build Log Endpoint](/api-reference/get-evaluator-build-log-endpoint)"
      operationId: "Gateway_GetEvaluator"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gatewayEvaluator"
      parameters:
      - name: "readMask"
        description: "The fields to be returned in the response. If empty or \"*\", all fields will be returned."
        in: "query"
        required: false
        schema:
          type: "string"
      - name: "account_id"
        in: "path"
        required: true
        description: "The Account Id"
        schema:
          type: "string"
      - name: "evaluator_id"
        in: "path"
        required: true
        description: "The Evaluator Id"
        schema:
          type: "string"
      tags:
      - "Gateway"
    patch:
      summary: "Update Evaluator"
      description: "Updates evaluator metadata (display_name, description, default_dataset).\nChanging `requirements` or `entry_point` triggers a rebuild. To upload new\nsource code, set `prepare_code_upload: true` then follow the upload flow."
      operationId: "Gateway_UpdateEvaluator"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gatewayEvaluator"
      parameters:
      - name: "prepareCodeUpload"
        description: "If true, prepare a new code upload/build attempt by transitioning the\nevaluator to BUILDING state. Can be used without update_mask."
        in: "query"
        required: false
        schema:
          type: "boolean"
      - name: "account_id"
        in: "path"
        required: true
        description: "The Account Id"
        schema:
          type: "string"
      - name: "evaluator_id"
        in: "path"
        required: true
        description: "The Evaluator Id"
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                displayName:
                  type: "string"
                description:
                  type: "string"
                createTime:
                  type: "string"
                  format: "date-time"
                  readOnly: true
                createdBy:
                  type: "string"
                  readOnly: true
                updateTime:
                  type: "string"
                  format: "date-time"
                  readOnly: true
                state:
                  $ref: "#/components/schemas/gatewayEvaluatorState"
                  readOnly: true
                criteria:
                  type: "array"
                  items:
                    type: "object"
                    $ref: "#/components/schemas/gatewayCriterion"
                  title: "Criteria for the evaluator, it should produce a score for the metric (name of criteria)\nUsed for eval3 with UI upload path"
                requirements:
                  type: "string"
                  title: "Content for the requirements.txt for package installation"
                entryPoint:
                  type: "string"
                  title: "entry point of the evaluator inside the codebase. In module::function or path::function format"
                status:
                  $ref: "#/components/schemas/gatewayStatus"
                  title: "Status of the evaluator, used to expose build status to the user"
                  readOnly: true
                commitHash:
                  type: "string"
                  title: "Commit hash of this evaluator from the user's original codebase"
                source:
                  $ref: "#/components/schemas/EvaluatorSource"
                  description: "Source information for the evaluator codebase."
                defaultDataset:
                  type: "string"
                  title: "Default dataset that is associated with the evaluator"
                encryptionState:
                  $ref: "#/components/schemas/gatewayEncryptionState"
                  description: "CMEK encryption state (authoritative, stamped at creation)."
                  readOnly: true
              title: "The evaluator to update. The name must be set."
        description: "The evaluator to update. The name must be set."
        required: true
      tags:
      - "Gateway"
    delete:
      summary: "Delete Evaluator"
      description: "Deletes an evaluator and its associated versions and build artifacts."
      operationId: "Gateway_DeleteEvaluator"
      responses:
