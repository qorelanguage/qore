    gatewayAccountUsageLimits:
      type: "object"
      properties:
        name:
          type: "string"
          title: "Resource name of the account usage-limits singleton.\nFormat: accounts/{account_id}/usageLimits"
          readOnly: true
        defaultUserLimit:
          $ref: "#/components/schemas/typeMoney"
          description: "The default per-user cap applied to every user without an override. Unset\nmeans no default cap (users are unlimited unless individually capped)."
        enforcementMode:
          $ref: "#/components/schemas/gatewayAccountUsageLimitsEnforcementMode"
          description: "Enforcement mode applied to the per-user caps in this account."
