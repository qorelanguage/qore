                  description: "max_with_revocable_replica_count is max replica count including revocable capacity.\nThe max revocable capacity will be max_with_revocable_replica_count - max_replica_count."
                desiredReplicaCount:
                  type: "integer"
                  format: "int32"
                  description: "The desired number of replicas for this deployment. This represents the target\nreplica count that the system is trying to achieve."
                  readOnly: true
                replicaCount:
                  type: "integer"
                  format: "int32"
                  readOnly: true
                autoscalingPolicy:
                  $ref: "#/components/schemas/gatewayAutoscalingPolicy"
                baseModel:
                  type: "string"
                  title: "The base model name. e.g. accounts/fireworks/models/falcon-7b"
                acceleratorCount:
                  type: "integer"
                  format: "int32"
                  description: "The number of accelerators used per replica.\nIf not specified, the default is the estimated minimum required by the\nbase model."
                acceleratorType:
                  $ref: "#/components/schemas/gatewayAcceleratorType"
                  description: "The type of accelerator to use."
                precision:
                  $ref: "#/components/schemas/DeploymentPrecision"
                  description: "The precision with which the model should be served."
                maxConcurrencyPerReplica:
                  type: "integer"
                  format: "int32"
                  description: "The maximum number of concurrent (in-flight) requests a single replica\nwill accept before shedding load. Requests that arrive while a replica is\nalready at this limit are rejected early with HTTP 429 instead of\nqueueing — a per-replica admission gate for controlling tail latency.\nWhen unset (0), the platform default is used."
                cluster:
                  type: "string"
                  description: "If set, this deployment is deployed to a cloud-premise cluster."
                  readOnly: true
                enableAddons:
                  type: "boolean"
                  description: "If true, PEFT addons are enabled for this deployment."
                draftTokenCount:
                  type: "integer"
                  format: "int32"
                  description: "The number of candidate tokens to generate per step for speculative\ndecoding.\nDefault is the base model's draft_token_count. Set\nCreateDeploymentRequest.disable_speculative_decoding to false to disable\nthis behavior."
                draftModel:
                  type: "string"
                  description: "The draft model name for speculative decoding. e.g. accounts/fireworks/models/my-draft-model\nIf empty, speculative decoding using a draft model is disabled.\nDefault is the base model's default_draft_model. Set\nCreateDeploymentRequest.disable_speculative_decoding to false to disable\nthis behavior."
                ngramSpeculationLength:
                  type: "integer"
                  format: "int32"
                  description: "The length of previous input sequence to be considered for N-gram speculation."
                enableSessionAffinity:
                  type: "boolean"
                  description: "Whether to apply sticky routing based on `user` field.\nServerless will be set to true when creating deployment."
                directRouteApiKeys:
                  type: "array"
                  items:
                    type: "string"
                  description: "The set of API keys used to access the direct route deployment. If direct routing is not enabled, this field is unused."
                numPeftDeviceCached:
                  type: "integer"
                  format: "int32"
                  title: "How many peft adapters to keep on gpu side for caching"
                directRouteType:
                  $ref: "#/components/schemas/gatewayDirectRouteType"
                  description: "If set, this deployment will expose an endpoint that bypasses the Fireworks API gateway."
                directRouteHandle:
                  type: "string"
                  description: "The handle for calling a direct route. The meaning of the handle depends on the\ndirect route type of the deployment:\n   INTERNET                    -> The host name for accessing the deployment\n   GCP_PRIVATE_SERVICE_CONNECT -> The service attachment name used to create the PSC endpoint.\n   AWS_PRIVATELINK             -> The service name used to create the VPC endpoint."
                  readOnly: true
                deploymentTemplate:
                  type: "string"
                  description: "The name of the deployment template to use for this deployment. Only\navailable to enterprise accounts."
                autoTune:
                  $ref: "#/components/schemas/gatewayAutoTune"
                  description: "The performance profile to use for this deployment."
                placement:
                  $ref: "#/components/schemas/gatewayPlacement"
                  description: "The desired geographic region where the deployment must be placed.\nIf unspecified, the default is the GLOBAL multi-region."
                region:
                  $ref: "#/components/schemas/gatewayRegion"
                  description: "The geographic region where the deployment is presently located. This region may change\nover time, but within the `placement` constraint."
                  readOnly: true
                maxContextLength:
                  type: "integer"
                  format: "int32"
                  description: "The maximum context length supported by the model (context window).\nIf set to 0 or not specified, the model's default maximum context length will be used."
                updateTime:
                  type: "string"
                  format: "date-time"
                  description: "The update time for the deployment."
                  readOnly: true
                disableDeploymentSizeValidation:
                  type: "boolean"
                  description: "Whether the deployment size validation is disabled."
                enableHotLoad:
                  type: "boolean"
                  description: "Whether to use hot load for this deployment."
                hotLoadBucketType:
                  $ref: "#/components/schemas/DeploymentHotLoadBucketType"
                  title: "hot load bucket name, indicate what type of storage to use for hot load"
                enableHotReloadLatestAddon:
                  type: "boolean"
                  description: "Allows up to 1 addon at a time to be loaded, and will merge it into the base model."
                deploymentShape:
                  type: "string"
                  description: "The name of the deployment shape that this deployment is using.\nOn the server side, this will be replaced with the deployment shape version name."
                activeModelVersion:
                  type: "string"
                  description: "The model version that is currently active and applied to running replicas of a deployment."
                targetModelVersion:
                  type: "string"
                  description: "The target model version that is being rolled out to the deployment.\nIn a ready steady state, the target model version is the same as the active model version."
                replicaStats:
                  $ref: "#/components/schemas/gatewayReplicaStats"
                  description: "Per-replica deployment status counters. Provides visibility into the deployment process\nby tracking replicas in different stages of the deployment lifecycle."
                  readOnly: true
                hotLoadBucketUrl:
                  type: "string"
                  title: "For hot load bucket location\ne.g for s3: s3://mybucket/<object_path>; for GCS: gs://mybucket/<object_path>, no trailing slash"
                pricingPlanId:
                  type: "string"
                  description: "Optional pricing plan ID for custom billing configuration.\nIf set, this deployment will use the pricing plan's billing rules\ninstead of default billing behavior."
                hotLoadTrainerJob:
                  type: "string"
                  title: "Trainer job whose hot_load_bucket_url this deployment should use.\nAt creation, the trainer's bucket URL is copied into this deployment's\nhot_load_bucket_url. The deployment continues working after the trainer\nis deleted (snapshot-at-creation semantics).\nFormat: accounts/{account}/rlorTrainerJobs/{job}"
                hotLoadTransitionType:
                  $ref: "#/components/schemas/DeploymentHotLoadTransitionType"
                  description: "Controls hot-load reload semantics for this deployment.\nASYNC (default when enable_hot_load is set) pauses the generator/prefiller\nmid-flight and skips draining in-flight requests during hot load.\nSYNC drains in-flight requests before applying the new model."
                preemptible:
                  type: "boolean"
                  description: "When true, this deployment runs as preemptible."
              title: "The properties of the deployment being updated. `deployment.name` must\nbe populated with the updated resource's name."
              required:
              - "baseModel"
        description: "The properties of the deployment being updated. `deployment.name` must\nbe populated with the updated resource's name."
